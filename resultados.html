<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Super 8 - Clasificación</title>
  <style>
    :root {
      --caribbean: #0a6772;
      --cambridge: #99bdb0;
      --ecru: #dcc27f;
      --sienna: #df8869;
      --redwood: #a44a47;
      --bg: #f7f4ee;
      --card: #fffdf9;
      --text: #2f3a3c;
      --muted: #6f7d7b;
      --border: #d7ddd8;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text)
    }

    header {
      background: var(--caribbean);
      color: #fff;
      padding: 16px;
    }

    header .wrap,
    main,
    footer .wrap {
      max-width: 820px;
      margin: auto;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-title {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .header-icon {
      font-size: 20px;
      line-height: 1.2;
    }

    .header-text {
      display: flex;
      flex-direction: column;
    }

    .header-text h1 {
      margin: 0;
      font-size: 20px;
    }

    .header-text small {
      margin-top: 2px;
      font-size: 13px;
      color: #e7f1ee;
    }

    main {
      padding: 16px 16px 30px
    }

    footer {
      padding: 8px 16px 28px;
      text-align: center;
      font-size: 12px;
      color: var(--redwood)
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(153, 189, 176, .4);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 5px 20px rgba(10, 103, 114, .08)
    }

    .result-title-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .result-title-row h2 {
      margin: 0;
    }

    .hero {
      background: linear-gradient(135deg, var(--caribbean), #0d7a83);
      color: white;
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(10, 103, 114, .18)
    }

    .hero h2 {
      margin: 0 0 8px;
      font-size: 28px;
      color: white
    }

    .hero p {
      margin: 0;
      color: #e7f1ee;
      line-height: 1.5
    }

    h2,
    h3 {
      color: var(--caribbean)
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .mode-card {
      border: 2px solid var(--cambridge);
      background: #fffefa;
      border-radius: 18px;
      padding: 18px;
      cursor: pointer;
      text-align: center;
      transition: .2s
    }

    .mode-card:hover,
    .mode-card.selected {
      border-color: var(--caribbean);
      box-shadow: 0 0 0 3px rgba(10, 103, 114, .10)
    }

    .mode-card .emoji {
      font-size: 36px;
      display: block;
      margin-bottom: 8px
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: var(--caribbean);
      margin: 0 0 5px 2px
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--cambridge);
      border-radius: 12px;
      font-size: 16px;
      background: #fffefa;
      color: var(--text)
    }

    input:focus {
      outline: none;
      border-color: var(--caribbean);
      box-shadow: 0 0 0 3px rgba(10, 103, 114, .12)
    }

    button,
    a.btn {
      display: inline-block;
      text-decoration: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 15px;
      font-weight: bold;
      cursor: pointer
    }

    .primary {
      background: var(--caribbean);
      color: #fff
    }

    .secondary {
      background: var(--cambridge);
      color: #163c3f
    }

    .accent {
      background: var(--sienna);
      color: white
    }

    .danger {
      background: var(--redwood);
      color: #fff
    }

    .ghost {
      background: transparent;
      color: white;
      border: 1px solid rgba(255, 255, 255, .3)
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
      justify-content: center;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }

    .badge.running {
      background: #e8f3ef;
      color: var(--caribbean)
    }

    .badge.done {
      background: #f5e2e1;
      color: var(--redwood);
      border: 1px solid rgba(164, 74, 71, .18);
    }

    .match {
      background: #f3f8f6;
      border: 1px solid var(--cambridge);
      border-radius: 15px;
      padding: 12px;
      margin-bottom: 10px
    }

    .match-title {
      color: var(--caribbean);
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: uppercase
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr 52px 18px 52px 1fr;
      gap: 5px;
      align-items: center
    }

    .team {
      text-align: center;
      font-weight: bold;
      font-size: 14px
    }

    .score input {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 8px 3px;
      border-color: var(--ecru)
    }

    .dash {
      text-align: center;
      color: var(--sienna);
      font-weight: bold
    }

    .status {
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted)
    }

    .error {
      color: var(--redwood);
      font-weight: bold
    }

    .ok {
      color: var(--caribbean);
      font-weight: bold
    }

    .progress {
      height: 10px;
      background: #eadfbf;
      border-radius: 999px;
      overflow: hidden;
      margin: 10px 0
    }

    .progress span {
      display: block;
      height: 100%;
      background: var(--sienna)
    }

    .tablewrap {
      overflow: auto;
      border: 1px solid var(--cambridge);
      border-radius: 14px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 340px;
      table-layout: fixed;
    }

    th,
    td {
      padding: 4px 7px;
      border-bottom: 1px solid #dde7e2;
      text-align: center;
      font-size: 12px
    }

    th {
      background: var(--cambridge);
      color: #173c3f;
      font-size: 12px
    }

    th:first-child,
    td:first-child {
      text-align: left
    }

    tbody tr:nth-child(even) {
      background: #fbf8f1
    }

    .podium {
      display: grid;
      gap: 12px
    }

    .place {
      background: var(--card);
      border: 1px solid var(--cambridge);
      border-radius: 18px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(10, 103, 114, .07)
    }

    .place.first {
      padding: 24px;
      background: linear-gradient(180deg, #fff9e8, #fffdf9);
      border-color: var(--ecru)
    }

    .medal {
      font-size: 40px
    }

    .place strong {
      display: block;
      font-size: 20px;
      margin: 5px 0;
      color: var(--caribbean)
    }

    .history-item {
      border: 1px solid var(--cambridge);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      background: #fffefa
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start
    }

    .history-name {
      font-weight: bold;
      color: var(--caribbean);
      font-size: 17px
    }

    .home-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .home-action {
      text-align: center;
      padding: 18px
    }

    .home-action .emoji {
      font-size: 32px;
      display: block;
      margin-bottom: 8px
    }

    .note {
      background: #fff8e7;
      border-left: 4px solid var(--ecru);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      color: #6d5a2c
    }

    .pair-card {
      border: 1px solid var(--cambridge);
      border-radius: 14px;
      padding: 12px;
      background: #f9fcfa
    }

    .pair-card h3 {
      margin: 0 0 10px;
      font-size: 15px
    }

    svg.lucide {
      width: 18px;
      height: 18px;
      stroke-width: 2;
      vertical-align: middle;
    }

    button svg.lucide,
    a.btn svg.lucide {
      margin-right: 5px;
    }

    .header-icon svg {
      width: 21px;
      height: 21px;
    }


    .alerta-faltantes {
      background: #fdeaea;
      border: 1px solid #e2b1b1;
      border-left: 6px solid var(--redwood);
      color: #8a2f2c;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      margin-top: 14px;
    }

    @media(max-width:600px) {

      .grid,
      .home-grid,
      .mode-grid {
        grid-template-columns: 1fr
      }

      .teams {
        grid-template-columns: 1fr 46px 14px 46px 1fr
      }

      .team {
        font-size: 12px
      }

      main {
        padding: 12px 12px 24px
      }

      .actions {
        flex-direction: column;
        align-items: center;
      }

      .actions .btn,
      .actions button {
        width: 100%;
        max-width: 280px;
        text-align: center;
      }
    }
  

    /* ===== Ajuste tipográfico móvil general ===== */
    @media(max-width:600px) {
      header {
        padding: 12px 14px;
      }

      .header-text h1 {
        font-size: 17px;
      }

      main {
        padding: 12px 12px 22px;
      }

      .card {
        padding: 10px;
        margin-bottom: 12px;
        border-radius: 16px;
      }

      .tablewrap {
        border-radius: 12px;
      }

      table {
        min-width: 0;
        width: 100%;
      }

      th,
      td {
        padding: 6px 4px;
        font-size: 12px;
        line-height: 1.15;
      }

      th {
        font-size: 12px;
      }

      th:first-child,
      td:first-child {
        width: 24%;
      }

      .card h2 {
        margin-bottom: 10px;
        font-size: 17px;
      }

      .card .muted {
        font-size: 11px;
        line-height: 1.35;
        margin: 10px 0 2px;
      }

      h2 {
        font-size: 18px;
      }

      h3 {
        font-size: 15px;
      }

      .hero {
        padding: 18px 16px;
        border-radius: 18px;
      }

      .hero h2 {
        font-size: 22px;
      }
    }

  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="header-row">

        <div class="header-title">
          <span class="header-icon">
            <i data-lucide=""></i>
          </span>

          <div class="header-text">
            <h1>Super 8 - Resultados</h1>

          </div>
        </div>

        <a class="btn ghost" href="inicio.html">
          <i data-lucide="house"></i>
          Inicio
        </a>

      </div>
    </div>
  </header>
  <main>
    <div class="card">

      <div class="result-title-row">
        <h2 id="tname"></h2>

        <span id="statusBadge" class="badge"></span>
      </div>

      <div id="meta" class="muted"></div>

    </div>

    <div class="card">
      <h2>Tabla de posiciones</h2>
      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th id="entityHeader"></th>
              <th>PJ</th>
              <th>PG</th>
              <th>A favor</th>
              <th>En contra</th>
              <th>Dif.</th>
            </tr>
          </thead>
          <tbody id="ranking"></tbody>
        </table>
      </div>
      <p class="muted"><strong>Desempate:</strong> ganados → diferencia → empate → juegos a favor → menos juegos en contra.</p>
    </div>

    <div class="card">
      <div class="actions"><a class="btn secondary" href="rondas.html">
          <i data-lucide=""></i>
          Corregir resultados
        </a>
        <a id="podiumBtn" class="btn primary" href="podio.html">
          <i data-lucide=""></i>
          Ver podio final
        </a>
      </div>

      <div id="pendingMsg" class="note" style="margin-top:12px;display:none"></div>
    </div>
  </main>
  <footer>
    <div class="wrap">© 2026 Dana Grecco</div>
  </footer>
  <script>
    function getTournaments() { return JSON.parse(localStorage.getItem('super8_tournaments') || '[]'); }
    function setTournaments(list) { localStorage.setItem('super8_tournaments', JSON.stringify(list)); }
    function getCurrentId() { return localStorage.getItem('super8_current_id'); }
    function setCurrentId(id) { localStorage.setItem('super8_current_id', String(id)); }
    function getCurrentTournament() {
      const id = getCurrentId();
      if (!id) return null;
      return getTournaments().find(t => String(t.id) === String(id)) || null;
    }
    function saveTournamentObject(t) {
      const list = getTournaments();
      const idx = list.findIndex(x => String(x.id) === String(t.id));
      if (idx >= 0) list[idx] = t; else list.unshift(t);
      setTournaments(list);
    }
    function formatDate(v) {
      if (!v) return '';
      const p = v.split('-');
      return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : v;
    }

    const individualFixture = [
      [[1, 2, 3, 4], [5, 6, 7, 8]],
      [[1, 3, 5, 7], [2, 4, 6, 8]],
      [[2, 3, 6, 7], [1, 4, 5, 8]],
      [[1, 5, 2, 6], [3, 7, 4, 8]],
      [[2, 5, 4, 7], [1, 6, 3, 8]],
      [[2, 8, 3, 5], [1, 7, 4, 6]],
      [[3, 6, 4, 5], [1, 8, 2, 7]]
    ];

    const pairsFixture = [
      [[1, 2], [3, 4], [5, 6], [7, 8]],
      [[1, 3], [2, 4], [5, 7], [6, 8]],
      [[1, 4], [2, 3], [5, 8], [6, 7]],
      [[1, 5], [2, 6], [3, 7], [4, 8]],
      [[1, 6], [2, 5], [3, 8], [4, 7]],
      [[1, 7], [2, 8], [3, 5], [4, 6]],
      [[1, 8], [2, 7], [3, 6], [4, 5]]
    ];

    function getFixture(data) { return data.mode === 'pairs' ? pairsFixture : individualFixture; }
    function totalMatches(data) { return data.mode === 'pairs' ? 28 : 14; }
    function entityCount(data) { return 8; }
    function entityLabel(data) { return data.mode === 'pairs' ? 'Pareja' : 'Participante'; }
    function displayEntity(data, id) {
      if (data.mode === 'pairs') {
        const p = data.pairs[id - 1];
        return `${p.member1} / ${p.member2}`;
      }
      return data.players[id - 1];
    }

    function calculateStats(data) {
      const fixture = getFixture(data), results = data.results || {};
      let s = [];
      if (data.mode === 'pairs') {
        s = data.pairs.map((p, i) => ({ id: i + 1, name: `${p.member1} / ${p.member2}`, pj: 0, pg: 0, gf: 0, gc: 0, diff: 0 }));
      } else {
        s = data.players.map((name, i) => ({ id: i + 1, name, pj: 0, pg: 0, gf: 0, gc: 0, diff: 0 }));
      }
      let h = {};

      fixture.forEach((r, ri) => r.forEach((m, mi) => {
        let z = results[`r${ri + 1}m${mi + 1}`]; if (!z || !z.valid) return;

        if (data.mode === 'pairs') {
          const a = m[0], b = m[1];
          s[a - 1].pj++; s[b - 1].pj++;
          s[a - 1].gf += z.a; s[a - 1].gc += z.b;
          s[b - 1].gf += z.b; s[b - 1].gc += z.a;
          if (z.a > z.b) s[a - 1].pg++;
          if (z.b > z.a) s[b - 1].pg++;
          const k = [Math.min(a, b), Math.max(a, b)].join('-');
          (h[k] ??= []).push(z.a > z.b ? a : z.b > z.a ? b : null);
        } else {
          let A = [m[0], m[1]], B = [m[2], m[3]];
          [...A, ...B].forEach(p => s[p - 1].pj++);
          A.forEach(p => { s[p - 1].gf += z.a; s[p - 1].gc += z.b });
          B.forEach(p => { s[p - 1].gf += z.b; s[p - 1].gc += z.a });
          if (z.a > z.b) A.forEach(p => s[p - 1].pg++);
          if (z.b > z.a) B.forEach(p => s[p - 1].pg++);
          A.forEach(a => B.forEach(b => {
            let k = [Math.min(a, b), Math.max(a, b)].join('-');
            (h[k] ??= []).push(z.a > z.b ? a : z.b > z.a ? b : null);
          }));
        }
      }));

      s.forEach(x => x.diff = x.gf - x.gc);

      s.sort((x, y) => {
        if (y.pg !== x.pg) return y.pg - x.pg;
        if (y.diff !== x.diff) return y.diff - x.diff;
        const tied = s.filter(q => q.pg === x.pg && q.diff === x.diff);
        if (tied.length === 2) {
          const k = [Math.min(x.id, y.id), Math.max(x.id, y.id)].join('-');
          const meetings = h[k] || [];
          if (meetings.length) {
            const wx = meetings.filter(v => v === x.id).length;
            const wy = meetings.filter(v => v === y.id).length;
            if (wx !== wy) return wy - wx;
          }
        }
        if (y.gf !== x.gf) return y.gf - x.gf;
        if (x.gc !== y.gc) return x.gc - y.gc;
        return x.name.localeCompare(y.name, 'es');
      });
      return s;
    }

    const data = getCurrentTournament();
    if (!data) location.href = 'inicio.html';

    const s = calculateStats(data),
      validCount = Object.values(data.results || {}).filter(x => x.valid).length, total = 
      totalMatches(data);

    document.getElementById('tname').textContent = data.name;

    document.getElementById('entityHeader').textContent = data.mode === 'pairs' ? 'Pareja' : 'Jugador';

    document.getElementById('meta').textContent =
      `${data.mode === 'pairs' ? 'Por parejas' : 'Individual'} · ` +
      `${formatDate(data.date)} · ` +
      `Partidos a ${data.target} puntos`;

    const statusBadge = document.getElementById('statusBadge');

    statusBadge.textContent = data.status;

    statusBadge.className =
      `badge ${data.status === 'Finalizado' ? 'done' : 'running'}`;

    document.getElementById('ranking').innerHTML =
      s.map(x =>
        `<tr>
      <td>${x.name}</td>
      <td>${x.pj}</td>
      <td>${x.pg}</td>
      <td>${x.gf}</td>
      <td>${x.gc}</td>
      <td>${x.diff > 0 ? '+' : ''}${x.diff}</td>
      </tr>`).join('');

    if (validCount !== total) {

      const pendingMsg =
        document.getElementById('pendingMsg');

      document.getElementById('podiumBtn').style.display =
        'none';

      pendingMsg.style.display =
        'block';

      pendingMsg.className =
        'alerta-faltantes';

      pendingMsg.textContent =
        `Faltan ${total - validCount} partido(s) válido(s). ` +
        `El podio se habilita al completar todos los partidos.`;
}
  </script>

  <script src="assets/js/lucide.min.js"></script>
  <script>
    lucide.createIcons();
  </script>

</body>

</html>
