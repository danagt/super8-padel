<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Super 8 - Historial</title>
  <style>
    :root {
      --caribbean: #0a6772;
      --cambridge: #99bdb0;
      --ecru: #dcc27f;
      --sienna: #df8869;
      --redwood: #a44a47;

      --desafio:#cc5a30;
      --desafio-dark:#b9684f;
      --desafio-soft:#f8e5dd;

      --bg: #f7f4ee;
      --card: #fffdf9;
      --text: #2f3a3c;
      --muted: #6f7d7b;
      --border: #d7ddd8;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text)
    }

    header {
      background: #b86b62;
      color: #fff;
      padding: 16px;
    }

    header .wrap,
    main,
    footer .wrap {
      max-width: 820px;
      margin: auto;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-title {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .header-icon {
      font-size: 20px;
      line-height: 1.2;
    }

    .header-text {
      display: flex;
      flex-direction: column;
    }

    .header-text h1 {
      margin: 0;
      font-size: 20px;
      color: #fff;
    }

    .header-text small {
      margin-top: 2px;
      font-size: 13px;
      color: #e7f1ee;
    }

    main {
      padding: 16px 16px 30px
    }

    main h2 {
      text-align: center;
    }

    footer {
      padding: 8px 16px 28px;
      text-align: center;
      font-size: 12px;
      color: var(--redwood)
    }

    .history-name.super8 {
      color: var(--caribbean);
    }

    .history-name.desafios {
      color: var(--desafio);
    }

    .history-item.super8-item {
      background: #e4f1ed;
      border-color: rgba(10, 103, 114, .28);
      box-shadow: 0 5px 18px rgba(10, 103, 114, .06);
    }

    .history-item.desafios-item {
      background: #fde7de;
      border-color: rgba(204, 90, 48, .35);
      box-shadow: 0 5px 18px rgba(204, 90, 48, .08);
    }

    .history-top .muted {
      text-align: center;
      font-size: 14px;
      margin-top: 2px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(153, 189, 176, .4);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 5px 20px rgba(10, 103, 114, .08)
    }

    .hero {
      background: linear-gradient(135deg, var(--caribbean), #0d7a83);
      color: white;
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(10, 103, 114, .18)
    }

    .hero h2 {
      margin: 0 0 8px;
      font-size: 28px;
      color: white
    }

    .hero p {
      margin: 0;
      color: #e7f1ee;
      line-height: 1.5
    }

    h2,
    h3 {
      color: var(--caribbean)
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .mode-card {
      border: 2px solid var(--cambridge);
      background: #fffefa;
      border-radius: 18px;
      padding: 18px;
      cursor: pointer;
      text-align: center;
      transition: .2s
    }

    .mode-card:hover,
    .mode-card.selected {
      border-color: var(--caribbean);
      box-shadow: 0 0 0 3px rgba(10, 103, 114, .10)
    }

    .mode-card .emoji {
      font-size: 36px;
      display: block;
      margin-bottom: 8px
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: var(--caribbean);
      margin: 0 0 5px 2px
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--cambridge);
      border-radius: 12px;
      font-size: 16px;
      background: #fffefa;
      color: var(--text)
    }

    input:focus {
      outline: none;
      border-color: var(--caribbean);
      box-shadow: 0 0 0 3px rgba(10, 103, 114, .12)
    }

    button,
    a.btn {
      display: inline-block;
      text-decoration: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 15px;
      font-weight: bold;
      cursor: pointer
    }

    .primary {
      background: var(--caribbean);
      color: #fff
    }

    .secondary {
      background: var(--cambridge);
      color: #163c3f
    }

    .accent {
      background: var(--sienna);
      color: white
    }

    .danger {
      background: var(--redwood);
      color: #fff
    }

    .ghost {
      background: transparent;
      color: #fff;;
      border: 1px solid rgba(122, 90, 19, .35)
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
      justify-content: center;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }

    .badge.running {
      background: #e8f3ef;
      color: var(--caribbean)
    }

    .badge.done {
      background: #f5e2e1;
      color: var(--redwood);
      border: 1px solid rgba(164, 74, 71, .18);
    }

    .badge.super8-badge {
      background: #e8f3ef;
      color: var(--caribbean);
      border: 1px solid rgba(10, 103, 114, .18);
    }

    .badge.desafio-badge {
      background: var(--desafio-soft);
      color: var(--desafio);
      border: 1px solid rgba(204, 90, 48, .22);
    }

    .match {
      background: #f3f8f6;
      border: 1px solid var(--cambridge);
      border-radius: 15px;
      padding: 12px;
      margin-bottom: 10px
    }

    .match-title {
      color: var(--caribbean);
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: uppercase
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr 52px 18px 52px 1fr;
      gap: 5px;
      align-items: center
    }

    .team {
      text-align: center;
      font-weight: bold;
      font-size: 14px
    }

    .score input {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 8px 3px;
      border-color: var(--ecru)
    }

    .dash {
      text-align: center;
      color: var(--sienna);
      font-weight: bold
    }

    .status {
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted)
    }

    .error {
      color: var(--redwood);
      font-weight: bold
    }

    .ok {
      color: var(--caribbean);
      font-weight: bold
    }

    .progress {
      height: 10px;
      background: #eadfbf;
      border-radius: 999px;
      overflow: hidden;
      margin: 10px 0
    }

    .progress span {
      display: block;
      height: 100%;
      background: var(--sienna)
    }

    .tablewrap {
      overflow: auto;
      border: 1px solid var(--cambridge);
      border-radius: 14px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px
    }

    th,
    td {
      padding: 10px 7px;
      border-bottom: 1px solid #dde7e2;
      text-align: center;
      font-size: 13px
    }

    th {
      background: var(--cambridge);
      color: #173c3f;
      font-size: 12px
    }

    th:first-child,
    td:first-child {
      text-align: left
    }

    tbody tr:nth-child(even) {
      background: #fbf8f1
    }

    .podium {
      display: grid;
      gap: 12px
    }

    .place {
      background: var(--card);
      border: 1px solid var(--cambridge);
      border-radius: 18px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(10, 103, 114, .07)
    }

    .place.first {
      padding: 24px;
      background: linear-gradient(180deg, #fff9e8, #fffdf9);
      border-color: var(--ecru)
    }

    .medal {
      font-size: 40px
    }

    .place strong {
      display: block;
      font-size: 20px;
      margin: 5px 0;
      color: var(--caribbean)
    }

    .history-item {
      border: 1px solid var(--cambridge);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      background: #fffefa;
      align-items: center;
    }

    .history-top {
      display: block;
    }

    .history-top .muted {
      text-align: center;
    }

    .history-name {
      font-weight: bold;
      color: var(--caribbean);
      font-size: 17px
    }

    .history-title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .home-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .home-action {
      text-align: center;
      padding: 18px
    }

    .home-action .emoji {
      font-size: 32px;
      display: block;
      margin-bottom: 8px
    }

    .note {
      background: #fff8e7;
      border-left: 4px solid var(--ecru);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      color: #6d5a2c
    }

    .pair-card {
      border: 1px solid var(--cambridge);
      border-radius: 14px;
      padding: 12px;
      background: #f9fcfa
    }

    .pair-card h3 {
      margin: 0 0 10px;
      font-size: 15px
    }

    svg.lucide {
      width: 18px;
      height: 18px;
      stroke-width: 2;
      vertical-align: middle;
    }

    button svg.lucide,
    a.btn svg.lucide {
      margin-right: 5px;
    }

    .header-icon svg {
      width: 21px;
      height: 21px;
    }

    @media(max-width:600px) {

      .grid,
      .home-grid,
      .mode-grid {
        grid-template-columns: 1fr
      }

      .teams {
        grid-template-columns: 1fr 46px 14px 46px 1fr
      }

      .team {
        font-size: 12px
      }

      main {
        padding: 12px 12px 24px
      }

      .actions {
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .actions .btn,
      .actions button {
        width: 100%;
        max-width: 280px;
        text-align: center;
      }
    }
  

    /* ===== Ajuste tipográfico móvil general ===== */
    @media(max-width:600px) {
      header {
        padding: 12px 14px;
      }

      .header-text h1 {
        font-size: 17px;
      }

      main {
        padding: 12px 12px 22px;
      }

      .card {
        padding: 12px;
        margin-bottom: 12px;
        border-radius: 16px;
      }

      h2 {
        font-size: 18px;
      }

      h3 {
        font-size: 15px;
      }

      .hero {
        padding: 18px 16px;
        border-radius: 18px;
      }

      .hero h2 {
        font-size: 22px;
      }
    }

  </style>
</head>

<body>
  <header class="historial-header">
    <div class="wrap">
      <div class="header-row">
        <div class="header-title">
          <div class="header-text historial-header-text">
            <h1>Historial</h1>
          </div>
        </div>

        <a class="btn ghost historial-ghost" href="inicio.html">
          <i data-lucide="house"></i>
          Inicio
        </a>
      </div>
    </div>
  </header>

  <main>
    <div class="card">
      <h2>Partidos finalizados</h2>
      <div id="list"></div>
    </div>
  </main>

  <footer>
    <div class="wrap">© 2026 Dana Grecco</div>
  </footer>

  <script src="assets/js/lucide.min.js"></script>

<script>

  function safeReadList(key) {
    try {
      const raw = localStorage.getItem(key);

      if (!raw) return [];

      const parsed = JSON.parse(raw);

      return Array.isArray(parsed)
        ? parsed
        : [];

    } catch (error) {

      console.error(`No se pudo leer ${key}:`, error);

      return [];
    }
  }


  function safeWriteList(key, list) {

    try {

      localStorage.setItem(
        key,
        JSON.stringify(list)
      );

      return true;

    } catch (error) {

      console.error(
        `No se pudo guardar ${key}:`,
        error
      );

      alert(
        'No se pudo guardar la información.'
      );

      return false;
    }
  }


  /* =========================
     SUPER 8
     ========================= */

  function getTournaments() {

    return safeReadList(
      'super8_tournaments'
    );
  }


  function setTournaments(list) {

    safeWriteList(
      'super8_tournaments',
      list
    );
  }


  function getCurrentId() {

    return localStorage.getItem(
      'super8_current_id'
    );
  }


  function setCurrentId(id) {

    localStorage.setItem(
      'super8_current_id',
      String(id)
    );
  }


  function totalMatches(data) {

    return data.mode === 'pairs'
      ? 28
      : 14;
  }


  /* =========================
     DESAFÍOS X 3
     ========================= */

  function getChallenges() {

    return safeReadList(
      'desafiosx3_history'
    );
  }


  function setChallenges(list) {

    safeWriteList(
      'desafiosx3_history',
      list
    );
  }


  /* =========================
     UTILIDADES
     ========================= */

  function formatDate(v) {

    if (!v) return '';

    const p = v.split('-');

    return p.length === 3
      ? `${p[2]}/${p[1]}/${p[0]}`
      : v;
  }


  function escapeHtml(value) {

    return String(value ?? '')

      .replaceAll('&', '&amp;')

      .replaceAll('<', '&lt;')

      .replaceAll('>', '&gt;')

      .replaceAll('"', '&quot;')

      .replaceAll("'", '&#039;');
  }


  /* =========================
     UNIFICAR HISTORIALES
     ========================= */

  function getUnifiedHistory() {

    const super8 = getTournaments()

      .filter(
        t => t.status === 'Finalizado'
      )

      .map(t => ({
        ...t,
        gameType: 'super8'
      }));


    const desafios = getChallenges()

      .filter(
        d => d.status === 'Finalizado'
      )

      .map(d => ({
        ...d,
        gameType: 'desafiosx3'
      }));


    return [
      ...super8,
      ...desafios
    ]

      .sort((a, b) => {

        const dateA =
          a.finishedAt ||
          a.date ||
          a.createdAt ||
          '';

        const dateB =
          b.finishedAt ||
          b.date ||
          b.createdAt ||
          '';

        return String(dateB)
          .localeCompare(
            String(dateA)
          );
      });
  }


  /* =========================
     MOSTRAR HISTORIAL
     ========================= */

  function render() {

    const list =
      getUnifiedHistory();

    const el =
      document.getElementById(
        'list'
      );


    if (!list.length) {

      el.innerHTML = `
        <p
          class="muted"
          style="text-align:center"
        >
          Todavía no hay juegos finalizados.
        </p>
      `;

      return;
    }


    el.innerHTML =
      list.map(item => {


        /* =====================
           SUPER 8
           ===================== */

        if (
          item.gameType ===
          'super8'
        ) {
          const valid =
            Object.values(
              item.results || {}
            )
            .filter(
              x => x.valid
            ).length;

          const total =
            totalMatches(item);

          return `
            <div class="history-item super8-item">
              <div class="history-top">
                <div
                  class="history-title-row"
                >
                  <div
                    class="history-name super8"
                  >
                    ${escapeHtml(item.name)}
                  </div>

                  <span
                    class="badge super8-badge"
                  >
                    Super 8 . ${item.mode === 'pairs' ? 'Por Parejas' : 'Individual'}
                  </span>
                </div>

                <div class="muted">
                  ${formatDate(item.date)}
                </div>
              </div>

              <div class="actions">
                <button
                  class="secondary"
                  type="button"
                  onclick="
                    openHistoryItem(
                      'super8',
                      '${item.id}'
                    )
                  "
                >
                  <i
                    data-lucide=""
                  ></i>
                  Abrir
                </button>

                <button
                  class="danger"
                  type="button"
                  onclick="
                    deleteHistoryItem(
                      'super8',
                      '${item.id}'
                    )
                  "
                >
                  <i
                    data-lucide=""
                  ></i>
                  Eliminar
                </button>
              </div>
            </div>
         `;
        }

        /* =====================
           DESAFÍOS X 3
           ===================== */

        return `
          <div class="history-item desafios-item">
            <div class="history-top">
              <div
                class="history-title-row"
              >
                <div
                  class="history-name desafios"
                >
                  ${escapeHtml(item.name)}
                </div>

                <span
                  class="badge desafio-badge"
                >
                  Desafíos x 3
                </span>
              </div>

              <div class="muted">
                ${formatDate(item.date)}
              </div>
            </div>

            <div class="actions">
              <button
                class="secondary"
                type="button"
                onclick="
                  openHistoryItem(
                    'desafiosx3',
                    '${item.id}'
                  )
                "
              >
                <i
                  data-lucide=""
                ></i>
                Abrir
              </button>

              <button
                class="danger"
                type="button"
                onclick="
                  deleteHistoryItem(
                    'desafiosx3',
                    '${item.id}'
                  )
                "
              >
                <i
                  data-lucide=""
                ></i>
                Eliminar
              </button>
            </div>
          </div>
        `;
      }).join('');

    lucide.createIcons();
  }

  /* =========================
     ABRIR
     ========================= */

  function openHistoryItem(
    type,
    id
  ) {
    if (
      type === 'super8'
    ) {
      setCurrentId(id);
      location.href = 'detalle.html';
      return;
    }

    localStorage.setItem(
      'desafiosx3_result_id',
      String(id)
    );

    location.href =
      'desafios/detalle.html';
  }

  /* =========================
     ELIMINAR
     ========================= */

  function deleteHistoryItem(
    type,
    id
  ) {
    if (
      type === 'super8'
    ) {
      const tournament =
        getTournaments()
        .find(
          x =>
            String(x.id) ===
            String(id)
        );

      if (!tournament)
        return;
      if (
        !confirm(
          `¿Querés eliminar definitivamente "${tournament.name}"?`
        )
      )
        return;

      const list =
        getTournaments()
        .filter(
          x =>
            String(x.id) !==
            String(id)
        );

      setTournaments(list);
      if (
        String(
          getCurrentId()
        ) ===
        String(id)
      ) {
        localStorage.removeItem(
          'super8_current_id'
        );
      }

      render();
      return;
    }

    const challenge =
      getChallenges()
      .find(
        x =>
          String(x.id) ===
          String(id)
      );

    if (!challenge)
      return;
    if (
      !confirm(
        `¿Querés eliminar definitivamente "${challenge.name}"?`
      )
    )
      return;
    const list =
      getChallenges()
      .filter(
        x =>
          String(x.id) !==
          String(id)
      );

    setChallenges(list);
    if (
      String(
        localStorage.getItem(
          'desafiosx3_result_id'
        )
      ) ===
      String(id)
    ) {
      localStorage.removeItem(
        'desafiosx3_result_id'
      );
    }

    render();
  }

  render();

  lucide.createIcons();

</script>
</body>
</html>
