<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a6772">

  <title>Super 8 Padel</title>

  <style>
    :root {
      --caribbean: #0a6772;
      --cambridge: #99bdb0;
      --ecru: #dcc27f;
      --sienna: #df8869;
      --redwood: #a44a47;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;

      background:
        linear-gradient(
          135deg,
          var(--caribbean) 0%,
          var(--caribbean) 55%,
          var(--cambridge) 100%
        );

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .bg-shape {
      position: fixed;
      border-radius: 50%;
      filter: blur(38px);
      opacity: .20;
      animation: drift 7s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .shape1 {
      width: 320px;
      height: 320px;
      background: var(--ecru);
      top: -80px;
      left: -100px;
    }

    .shape2 {
      width: 260px;
      height: 260px;
      background: var(--sienna);
      right: -70px;
      top: 10%;
      animation-delay: 1s;
    }

    .shape3 {
      width: 200px;
      height: 200px;
      background: var(--redwood);
      bottom: 5%;
      left: 20%;
      animation-delay: 2s;
    }

    .shape4 {
      width: 240px;
      height: 240px;
      background: var(--cambridge);
      bottom: -40px;
      right: -40px;
      animation-delay: 1.5s;
    }

    .wrap {
      width: min(92vw, 440px);
      padding: 34px 26px 24px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .logo {
      width: 150px;
      height: 150px;
      margin: 0 auto 28px;

      border-radius: 28px;

      display: grid;
      place-items: center;

      animation: logoAppear .9s ease-out;

      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .22));
    }

    .logo img {
      width: 150px;
      height: 150px;
      object-fit: contain;
      display: block;
      transform: scale(1.06);
    }

    h1 {
      margin: 0;
      color: white;
      font-size: 3rem;
      letter-spacing: -.02em;

      animation: titleAppear .8s .4s both;
    }

    .title-line {
      width: 120px;
      height: 4px;

      margin: 16px auto 0;

      border-radius: 999px;

      background: var(--ecru);

      animation: lineAppear .7s .9s both;
    }

    p {
      margin: 22px auto 0;

      color: rgba(255, 255, 255, .85);

      line-height: 1.6;

      max-width: 360px;

      font-size: 15px;

      animation: fadeAppear .7s 1.2s both;
    }

    .palette-dots {
      display: flex;
      justify-content: center;
      gap: 9px;

      margin-top: 34px;
    }

    .palette-dots span {
      width: 12px;
      height: 12px;

      border-radius: 50%;

      animation: pulseDot 1.5s infinite;
    }

    .palette-dots span:nth-child(1) {
      background: var(--caribbean);
    }

    .palette-dots span:nth-child(2) {
      background: var(--cambridge);
      animation-delay: .15s;
    }

    .palette-dots span:nth-child(3) {
      background: var(--ecru);
      animation-delay: .30s;
    }

    .palette-dots span:nth-child(4) {
      background: var(--sienna);
      animation-delay: .45s;
    }

    .palette-dots span:nth-child(5) {
      background: var(--redwood);
      animation-delay: .60s;
    }

    .btn {
      display: inline-block;
      width: auto;

      margin-top: 44px;

      text-decoration: none;

      border: 0;
      border-radius: 999px;

      padding: 14px 38px;

      font-weight: bold;
      font-size: 16px;

      cursor: pointer;

      background: var(--sienna);
      color: white;

      box-shadow: 0 10px 24px rgba(0, 0, 0, .18);

      transition:
        transform .15s ease,
        box-shadow .15s ease;

      animation: buttonAppear .7s 1.8s both;
    }

    .btn:hover {
      transform: scale(1.05);

      box-shadow:
        0 14px 26px rgba(0, 0, 0, .22);
    }

    .foot {
      margin-top: 18px;

      font-size: 12px;

      color: rgba(255, 255, 255, .7);
    }

    @keyframes logoAppear {
      from {
        opacity: 0;
        transform: scale(0) rotate(-180deg);
      }

      to {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    @keyframes titleAppear {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes lineAppear {
      from {
        width: 0;
      }

      to {
        width: 120px;
      }
    }

    @keyframes fadeAppear {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes buttonAppear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseDot {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.4);
      }
    }

    @keyframes drift {
      0% {
        transform: translateY(0) translateX(0);
      }

      100% {
        transform: translateY(18px) translateX(10px);
      }
    }

    @media(max-width:600px) {

    .wrap {
      width: min(94vw, 420px);
      padding: 24px 18px 20px;
    }

    .logo {
      width: 145px;
      height: 145px;
      margin-bottom: 24px;
    }

    .logo img {
      width: 145px;
      height: 145px;
      object-fit: contain;
    }

    h1 {
      font-size: 38px;
    }

    p {
      font-size: 14px;
      max-width: 330px;
    }

    .palette-dots {
      margin-top: 28px;
    }

    .btn {
      width: 100%;
      max-width: 280px;
      margin-top: 38px;
    }
  }

  

    /* ===== Ajuste tipográfico móvil splash ===== */
    @media(max-width:600px) {
      h1 {
        font-size: 30px;
      }

      .subtitle {
        font-size: 14px;
      }
    }

  </style>
</head>

<body>

  <div class="bg-shape shape1"></div>
  <div class="bg-shape shape2"></div>
  <div class="bg-shape shape3"></div>
  <div class="bg-shape shape4"></div>

  <main class="wrap">

    <div class="logo">
      <img src="assets/img/paleta2.png" alt="Paleta de padel">
    </div>

    <h1>Super 8 Padel</h1>

    <div class="title-line"></div>

    <p>
      Organizar juegos, cargar resultados y consultar
      la clasificación y el podio de forma simple.
    </p>

    <div class="palette-dots">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <a class="btn" href="inicio.html">
      Comenzar
    </a>

    <div class="foot">
      © 2026 Dana Grecco
    </div>

  </main>


</body>

</html>
