<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a6772">
  <title>Super 8 Padel</title>
  <style>
    :root{
      --caribbean:#0a6772;
      --cambridge:#99bdb0;
      --ecru:#dcc27f;
      --sienna:#df8869;
      --redwood:#a44a47;
      --bg:#f7f4ee;
      --card:#fffdf9;
      --text:#2f3a3c;
      --muted:#6f7d7b;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top, rgba(153,189,176,.25), transparent 35%),
        linear-gradient(180deg, #fbf7ef 0%, var(--bg) 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .bg-shape{
      position:fixed;
      border-radius:50%;
      filter:blur(6px);
      opacity:.35;
      animation: drift 7s ease-in-out infinite alternate;
      pointer-events:none;
    }

    .shape1{
      width:180px;height:180px;
      background:var(--cambridge);
      top:6%; left:8%;
    }

    .shape2{
      width:140px;height:140px;
      background:var(--ecru);
      right:10%; top:15%;
      animation-delay:1s;
    }

    .shape3{
      width:210px;height:210px;
      background:var(--sienna);
      bottom:6%; left:12%;
      animation-delay:2s;
    }

    .shape4{
      width:120px;height:120px;
      background:var(--redwood);
      bottom:10%; right:12%;
      animation-delay:1.5s;
    }

    .wrap{
      width:min(92vw, 420px);
      background:rgba(255,253,249,.78);
      backdrop-filter: blur(8px);
      border:1px solid rgba(153,189,176,.28);
      border-radius:28px;
      padding:34px 26px 24px;
      text-align:center;
      box-shadow:0 18px 48px rgba(10,103,114,.12);
      position:relative;
      z-index:1;
    }

    .logo{
      width:110px;
      height:110px;
      margin:0 auto 18px;
      border-radius:32px;
      background:linear-gradient(145deg,var(--caribbean),#0f818c);
      display:grid;
      place-items:center;
      color:white;
      font-size:56px;
      font-weight:700;
      box-shadow:0 16px 30px rgba(10,103,114,.22);
      animation: float 2.6s ease-in-out infinite;
      position:relative;
    }

    .logo::after{
      content:"";
      position:absolute;
      inset:-10px;
      border-radius:38px;
      border:2px solid rgba(220,194,127,.48);
      animation: pulse 2.6s ease-in-out infinite;
    }

    h1{
      margin:0 0 10px;
      color:var(--caribbean);
      font-size:2rem;
      letter-spacing:-.02em;
    }

    p{
      margin:0 auto 22px;
      color:var(--muted);
      line-height:1.5;
      max-width:290px;
      font-size:15px;
    }

    .pill{
      display:inline-block;
      background:rgba(153,189,176,.18);
      color:var(--caribbean);
      padding:7px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:bold;
      margin-bottom:16px;
    }

    .btn{
      display:inline-block;
      width:100%;
      text-decoration:none;
      border:0;
      border-radius:14px;
      padding:14px 18px;
      font-weight:bold;
      font-size:16px;
      cursor:pointer;
      background:var(--caribbean);
      color:white;
      box-shadow:0 10px 20px rgba(10,103,114,.16);
      transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
      background:#085761;
      box-shadow:0 14px 24px rgba(10,103,114,.2);
    }

    .foot{
      margin-top:16px;
      font-size:12px;
      color:var(--redwood);
    }

    @keyframes float{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-10px)}
    }

    @keyframes pulse{
      0%{transform:scale(1); opacity:.85}
      70%{transform:scale(1.1); opacity:.15}
      100%{transform:scale(1.1); opacity:0}
    }

    @keyframes drift{
      0%{transform:translateY(0) translateX(0)}
      100%{transform:translateY(18px) translateX(10px)}
    }
  </style>
</head>
<body>
  <div class="bg-shape shape1"></div>
  <div class="bg-shape shape2"></div>
  <div class="bg-shape shape3"></div>
  <div class="bg-shape shape4"></div>

  <main class="wrap">
    <div class="pill">🎾 Individual y por parejas</div>
    <div class="logo">8</div>
    <h1>Super 8 Padel</h1>
    <p>Organizar torneos, cargar resultados y consultar la clasificación y el podio de forma simple.</p>
    <a class="btn" href="inicio.html">Comenzar</a>
    <div class="foot">© 2026 Dana Grecco</div>
  </main>
</body>
</html>
