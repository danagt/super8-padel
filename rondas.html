<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Super 8 - Rondas</title>
  <style>
    :root {
      --caribbean: #0a6772;
      --cambridge: #99bdb0;
      --ecru: #dcc27f;
      --sienna: #df8869;
      --redwood: #a44a47;
      --bg: #f7f4ee;
      --card: #fffdf9;
      --text: #2f3a3c;
      --muted: #6f7d7b;
      --border: #d7ddd8;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text)
    }

    header {
      background: var(--caribbean);
      color: #fff;
      padding: 16px;
    }

    header .wrap,
    main,
    footer .wrap {
      max-width: 820px;
      margin: auto;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-title {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .header-icon {
      font-size: 20px;
      line-height: 1.2;
    }

    .header-text {
      display: flex;
      flex-direction: column;
    }

    .header-text h1 {
      margin: 0;
      font-size: 20px;
    }

    .header-text small {
      margin-top: 2px;
      font-size: 13px;
      color: #e7f1ee;
    }

    main {
      padding: 16px 16px 30px
    }

    footer {
      padding: 8px 16px 28px;
      text-align: center;
      font-size: 12px;
      color: var(--redwood)
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(153, 189, 176, .4);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 5px 20px rgba(10, 103, 114, .08)
    }

    .hero {
      background: linear-gradient(135deg, var(--caribbean), #0d7a83);
      color: white;
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(10, 103, 114, .18)
    }

    .hero h2 {
      margin: 0 0 8px;
      font-size: 28px;
      color: white
    }

    .hero p {
      margin: 0;
      color: #e7f1ee;
      line-height: 1.5
    }

    h2,
    h3 {
      color: var(--caribbean)
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .mode-card {
      border: 2px solid var(--cambridge);
      background: #fffefa;
      border-radius: 18px;
      padding: 18px;
      cursor: pointer;
      text-align: center;
      transition: .2s
    }

    .mode-card:hover,
    .mode-card.selected {
      border-color: var(--caribbean);
      box-shadow: 0 0 0 3px rgba(10, 103, 114, .10)
    }

    .mode-card .emoji {
      font-size: 36px;
      display: block;
      margin-bottom: 8px
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: var(--caribbean);
      margin: 0 0 5px 2px
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--cambridge);
      border-radius: 12px;
      font-size: 16px;
      background: #fffefa;
      color: var(--text)
    }

    input:focus {
      outline: none;
      border-color: var(--caribbean);
      box-shadow: 0 0 0 3px rgba(10, 103, 114, .12)
    }

    button,
    a.btn {
      display: inline-block;
      text-decoration: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 15px;
      font-weight: bold;
      cursor: pointer
    }

    .primary {
      background: var(--caribbean);
      color: #fff
    }

    .secondary {
      background: var(--cambridge);
      color: #163c3f
    }

    .accent {
      background: var(--sienna);
      color: white
    }

    .danger {
      background: var(--redwood);
      color: #fff
    }

    .ghost {
      background: transparent;
      color: white;
      border: 1px solid rgba(255, 255, 255, .3)
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
      justify-content: center;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: bold
    }

    .badge.running {
      background: #e8f3ef;
      color: var(--caribbean)
    }

    .badge.done {
      background: #f6ead0;
      color: #7a5a13
    }

    .match {
      background: #f3f8f6;
      border: 1px solid var(--cambridge);
      border-radius: 15px;
      padding: 12px;
      margin-bottom: 10px
    }

    .match-title {
      color: var(--caribbean);
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: uppercase
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr 52px 18px 52px 1fr;
      gap: 5px;
      align-items: center
    }

    .team {
      text-align: center;
      font-weight: bold;
      font-size: 14px
    }

    .score input {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 8px 3px;
      border-color: var(--ecru)
    }

    .dash {
      text-align: center;
      color: var(--sienna);
      font-weight: bold
    }

    .status {
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted)
    }

    .error {
      color: var(--redwood);
      font-weight: bold
    }

    .ok {
      color: var(--caribbean);
      font-weight: bold
    }

    .progress {
      height: 10px;
      background: #eadfbf;
      border-radius: 999px;
      overflow: hidden;
      margin: 10px 0
    }

    .progress span {
      display: block;
      height: 100%;
      background: var(--sienna)
    }

    .tablewrap {
      overflow: auto;
      border: 1px solid var(--cambridge);
      border-radius: 14px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px
    }

    th,
    td {
      padding: 10px 7px;
      border-bottom: 1px solid #dde7e2;
      text-align: center;
      font-size: 13px
    }

    th {
      background: var(--cambridge);
      color: #173c3f;
      font-size: 12px
    }

    th:first-child,
    td:first-child {
      text-align: left
    }

    tbody tr:nth-child(even) {
      background: #fbf8f1
    }

    .podium {
      display: grid;
      gap: 12px
    }

    .place {
      background: var(--card);
      border: 1px solid var(--cambridge);
      border-radius: 18px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(10, 103, 114, .07)
    }

    .place.first {
      padding: 24px;
      background: linear-gradient(180deg, #fff9e8, #fffdf9);
      border-color: var(--ecru)
    }

    .medal {
      font-size: 40px
    }

    .place strong {
      display: block;
      font-size: 20px;
      margin: 5px 0;
      color: var(--caribbean)
    }

    .history-item {
      border: 1px solid var(--cambridge);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      background: #fffefa
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start
    }

    .history-name {
      font-weight: bold;
      color: var(--caribbean);
      font-size: 17px
    }

    .home-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .home-action {
      text-align: center;
      padding: 18px
    }

    .home-action .emoji {
      font-size: 32px;
      display: block;
      margin-bottom: 8px
    }

    .note {
      background: #fff8e7;
      border-left: 4px solid var(--ecru);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      color: #6d5a2c
    }

    .pair-card {
      border: 1px solid var(--cambridge);
      border-radius: 14px;
      padding: 12px;
      background: #f9fcfa
    }

    .pair-card h3 {
      margin: 0 0 10px;
      font-size: 15px
    }

    svg.lucide {
      width: 18px;
      height: 18px;
      stroke-width: 2;
      vertical-align: middle;
    }

    button svg.lucide,
    a.btn svg.lucide {
      margin-right: 5px;
    }

    button svg.lucide:last-child {
      margin-right: 0;
      margin-left: 5px;
    }

    .header-icon svg {
      width: 21px;
      height: 21px;
    }

    @media(max-width:600px) {

      .grid,
      .home-grid,
      .mode-grid {
        grid-template-columns: 1fr
      }

      .teams {
        grid-template-columns: 1fr 46px 14px 46px 1fr
      }

      .team {
        font-size: 12px
      }

      main {
        padding: 12px 12px 24px
      }

      .actions {
        flex-direction: column;
        align-items: center;
      }

      .actions .btn,
      .actions button {
        width: 100%;
        max-width: 280px;
        text-align: center;
      }
    }


    /* ===== Ajuste tipográfico móvil general ===== */
    @media(max-width:600px) {
      header {
        padding: 12px 14px;
      }

      .header-text h1 {
        font-size: 17px;
      }

      main {
        padding: 12px 12px 22px;
      }

      .card {
        padding: 12px;
        margin-bottom: 12px;
        border-radius: 16px;
      }

      h2 {
        font-size: 18px;
      }

      h3 {
        font-size: 15px;
      }

      .hero {
        padding: 18px 16px;
        border-radius: 18px;
      }

      .hero h2 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="header-row">

        <div class="header-title">
          <span class="header-icon">
            <i data-lucide=""></i>
          </span>

          <div class="header-text">
            <h1>Super 8</h1>
            <small id="subtitle">Rondas</small>
          </div>
        </div>

        <a class="btn ghost" href="inicio.html#juegos-en-curso" onclick="return saveBeforeHome()">

          <i data-lucide="house"></i>
          Inicio
        </a>

      </div>
    </div>
  </header>

  <main>
    <div class="card">
      <h2 id="title"></h2>
      <div class="muted" id="targetInfo"></div>
      <div class="progress"><span id="bar"></span></div>
      <div class="muted" id="prog"></div>
      <div id="matches"></div>

      <div class="actions">
        <button id="prevBtn" class="secondary" onclick="prev()">
          <i data-lucide=""></i>
          Anterior
        </button>

        <button class="secondary" onclick="next()">
          Siguiente
          <i data-lucide=""></i>
        </button>

        <button class="primary" onclick="goResults()">
          <i data-lucide=""></i>
          Ver clasificación
        </button>
      </div>

    </div>
  </main>

  <footer>
    <div class="wrap">© 2026 Dana Grecco</div>
  </footer>

  <script>
    const individualFixture = [
      [[1, 2, 3, 4], [5, 6, 7, 8]],
      [[1, 3, 5, 7], [2, 4, 6, 8]],
      [[2, 3, 6, 7], [1, 4, 5, 8]],
      [[1, 5, 2, 6], [3, 7, 4, 8]],
      [[2, 5, 4, 7], [1, 6, 3, 8]],
      [[2, 8, 3, 5], [1, 7, 4, 6]],
      [[3, 6, 4, 5], [1, 8, 2, 7]]
    ];

    const pairsFixture = [
      [[1, 2], [3, 4], [5, 6], [7, 8]],
      [[1, 3], [2, 4], [5, 7], [6, 8]],
      [[1, 4], [2, 3], [5, 8], [6, 7]],
      [[1, 5], [2, 6], [3, 7], [4, 8]],
      [[1, 6], [2, 5], [3, 8], [4, 7]],
      [[1, 7], [2, 8], [3, 5], [4, 6]],
      [[1, 8], [2, 7], [3, 6], [4, 5]]
    ];

    function getFixture(data) { return data.mode === 'pairs' ? pairsFixture : individualFixture; }
    function totalMatches(data) { return data.mode === 'pairs' ? 28 : 14; }
    function entityCount(data) { return 8; }
    function entityLabel(data) { return data.mode === 'pairs' ? 'Pareja' : 'Participante'; }
    function displayEntity(data, id) {
      if (data.mode === 'pairs') {
        const p = data.pairs[id - 1];
        return `${p.member1} / ${p.member2}`;
      }
      return data.players[id - 1];
    }

    function getTournaments() { return JSON.parse(localStorage.getItem('super8_tournaments') || '[]'); }
    function setTournaments(list) { localStorage.setItem('super8_tournaments', JSON.stringify(list)); }
    function getCurrentId() { return localStorage.getItem('super8_current_id'); }
    function setCurrentId(id) { localStorage.setItem('super8_current_id', String(id)); }
    function getCurrentTournament() {
      const id = getCurrentId();
      if (!id) return null;
      return getTournaments().find(t => String(t.id) === String(id)) || null;
    }
    function saveTournamentObject(t) {
      const list = getTournaments();
      const idx = list.findIndex(x => String(x.id) === String(t.id));
      if (idx >= 0) list[idx] = t; else list.unshift(t);
      setTournaments(list);
    }
    function formatDate(v) {
      if (!v) return '';
      const p = v.split('-');
      return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : v;
    }

    let data = getCurrentTournament(); if (!data) location.href = 'inicio.html';
    let fixture = getFixture(data), current = Number(localStorage.getItem('super8_round') || 0); data.results = data.results || {};

    function validatePair(aRaw, bRaw) {
      if (aRaw === '' && bRaw === '') return { empty: true };
      if (aRaw === '' || bRaw === '') return { valid: false, msg: 'Completá ambos puntajes.' };
      const a = Number(aRaw), b = Number(bRaw), target = Number(data.target);
      if (!Number.isInteger(a) || !Number.isInteger(b)) return { valid: false, msg: 'Los puntajes deben ser números enteros.' };
      if (a < 0 || b < 0) return { valid: false, msg: 'No se permiten valores negativos.' };
      if (a === b) return { valid: false, msg: 'El partido no puede terminar empatado.' };
      if (a > target || b > target) return { valid: false, msg: `Ningún puntaje puede superar ${target}.` };
      if (!((a === target && b < target) || (b === target && a < target))) return { valid: false, msg: `Uno de los dos resultados debe ser exactamente ${target}.` };
      return { valid: true, a, b };
    }

    function activarAvanceAutomatico() {
      const inputs = [
        ...document.querySelectorAll(
          '#matches .score input'
        )
      ];
      inputs.forEach((input, index) => {
        /* Al volver a un campo,
          selecciona el número para corregirlo fácil */
        input.addEventListener('focus', () => {
          input.select();
        });
        input.addEventListener('input', () => {
          if (input.value === '') {
            return;
          }
          const value = Number(input.value);
          const target = Number(data.target);
          if (
            !Number.isInteger(value) ||
            value < 0 ||
            value > target
          ) {
            return;
          }
          /* Hay otro resultado después */
          if (index < inputs.length - 1) {
            inputs[index + 1].focus();
          } else {
            /* Último resultado de la ronda:
              dejamos seleccionado Siguiente */
            const nextButton =
              document.querySelector(
                'button[onclick="next()"]'
              );
            if (nextButton) {
              nextButton.focus();
            }
          }
        });

        /* También permite usar la tecla
          Siguiente / Enter del teclado */
        input.addEventListener(
          'keydown',
          event => {
            if (event.key !== 'Enter') {
              return;
            }
            event.preventDefault();
            if (index < inputs.length - 1) {
              inputs[index + 1].focus();
            } else {
              const nextButton =
                document.querySelector(
                  'button[onclick="next()"]'
                );
              if (nextButton) {
                nextButton.focus();
              }
            }
          }
        );
      });
    }

    function render() {

      document.getElementById('title').textContent = 
        `Ronda ${current + 1} de 7`;

      document.getElementById('prevBtn').style.display =
        current === 0 ? 'none' : '';

      document.getElementById('subtitle').textContent = 
        `${data.mode === 'pairs' 
        ? 'Parejas' 
        : 'Individual'} · Ronda ${current + 1}`;

      document.getElementById('targetInfo').textContent = 
        `Partidos a ${data.target} puntos`;

      let out = '';
      fixture[current].forEach((m, mi) => {
        const id = `r${current + 1}m${mi + 1}`, z = data.results[id] || {};
        let left, right;
        if (data.mode === 'pairs') { left = displayEntity(data, m[0]); right = displayEntity(data, m[1]); }
        else { left = `${displayEntity(data, m[0])} + ${displayEntity(data, m[1])}`; right = `${displayEntity(data, m[2])} + ${displayEntity(data, m[3])}`; }
        out += `<div class="match"><div class="match-title">Partido ${mi + 1}</div><div class="teams">
    <div class="team">${left}</div>
    <div class="score">
      <input 
        id="${id}a" 
        type="number" 
        min="0" 
        max="${data.target}" 
        step="1" 
        value="${z.a ?? ''}">
    </div>

    <div class="dash">-</div>

    <div class="score">
      <input 
        id="${id}b" 
        type="number" 
        min="0" 
        max="${data.target}" 
        step="1" 
        value="${z.b ?? ''}">
    </div>
    <div class="team">${right}</div>
    </div>
    <div class="status ${z.valid ? 'ok' : (z.error ? 'error' : '')}" id="${id}s">${z.valid ? 'Resultado válido' : (z.error || 'Resultado pendiente')}</div></div>`;
      });

      document.getElementById('matches').innerHTML = out;
      activarAvanceAutomatico()
      progress();

      /* FOCO AUTOMÁTICO SOLO EN CELULAR */
      if (window.matchMedia('(max-width: 600px)').matches) {
        setTimeout(() => {

          const inputs =
            document.querySelectorAll('#matches input');

          const firstEmpty =
            Array.from(inputs).find(
              input => input.value === ''
            );

          if (firstEmpty) {
            firstEmpty.focus();
          }

        }, 300);
      }
    }

    function saveRound(blockOnError = true) {
      let hasError = false;
      fixture[current].forEach((m, mi) => {
        const id = `r${current + 1}m${mi + 1}`, a = document.getElementById(id + 'a').value, b = document.getElementById(id + 'b').value, r = validatePair(a, b), s = document.getElementById(id + 's');
        if (r.empty) { delete data.results[id]; s.textContent = 'Resultado pendiente'; s.className = 'status'; return; }
        if (!r.valid) { data.results[id] = { a: a === '' ? '' : Number(a), b: b === '' ? '' : Number(b), valid: false, error: r.msg }; s.textContent = r.msg; s.className = 'status error'; hasError = true; return; }
        data.results[id] = { a: r.a, b: r.b, valid: true }; s.textContent = 'Resultado válido'; s.className = 'status ok';
      });

      const validCount = Object.values(data.results).filter(x => x.valid).length;
      data.status = validCount === totalMatches(data)
        ? 'Finalizado'
        : 'En curso';
      saveTournamentObject(data);

      progress();
      if (hasError && blockOnError) alert('Hay resultados inválidos o incompletos en esta ronda. Corregilos antes de continuar.');
      return !hasError;
    }

    function progress() { const n = Object.values(data.results).filter(x => x.valid).length, total = totalMatches(data); document.getElementById('prog').textContent = `${n} / ${total} partidos válidos cargados`; document.getElementById('bar').style.width = `${n / total * 100}%`; }
    function prev() { if (!saveRound(true)) return; if (current > 0) current--; localStorage.setItem('super8_round', current); render(); }
    function next() { if (!saveRound(true)) return; if (current < 6) current++; else return goResults(); localStorage.setItem('super8_round', current); render(); }
    function goResults() { if (!saveRound(true)) return; location.href = 'resultados.html'; }
    function saveBeforeHome() { saveRound(false); return true; }
    render();

  </script>

  <script src="assets/js/lucide.min.js"></script>
  <script>
    lucide.createIcons();
  </script>

</body>

</html>
