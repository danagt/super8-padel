<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Super 8 - Nuevo torneo</title>
  <style>
    :root {
      --caribbean: #0a6772;
      --cambridge: #99bdb0;
      --ecru: #dcc27f;
      --sienna: #df8869;
      --redwood: #a44a47;
      --bg: #f7f4ee;
      --card: #fffdf9;
      --text: #2f3a3c;
      --muted: #6f7d7b;
      --border: #d7ddd8;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text)
    }

    header {
      background: var(--caribbean);
      color: #fff;
      padding: 16px;
    }

    header .wrap,
    main,
    footer .wrap {
      max-width: 820px;
      margin: auto;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-title {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .header-icon {
      font-size: 20px;
      line-height: 1.2;
    }

    .header-text {
      display: flex;
      flex-direction: column;
    }

    .header-text h1 {
      margin: 0;
      font-size: 20px;
    }

    .header-text small {
      margin-top: 2px;
      font-size: 13px;
      color: #e7f1ee;
    }

    main {
      padding: 16px 16px 30px
    }

    footer {
      padding: 8px 16px 28px;
      text-align: center;
      font-size: 12px;
      color: var(--redwood)
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(153, 189, 176, .4);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 5px 20px rgba(10, 103, 114, .08)
    }

    .hero {
      background: linear-gradient(135deg, var(--caribbean), #0d7a83);
      color: white;
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(10, 103, 114, .18)
    }

    .hero h2 {
      margin: 0 0 8px;
      font-size: 28px;
      color: white
    }

    .hero p {
      margin: 0;
      color: #e7f1ee;
      line-height: 1.5
    }

    h2,
    h3 {
      color: var(--caribbean)
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .mode-card {
      border: 2px solid var(--cambridge);
      background: #fffefa;
      border-radius: 18px;
      padding: 18px;
      cursor: pointer;
      text-align: center;
      transition: .2s
    }

    .mode-card:hover,
    .mode-card.selected {
      border-color: var(--caribbean);
      box-shadow: 0 0 0 3px rgba(10, 103, 114, .10)
    }

    .mode-card .emoji {
      font-size: 36px;
      display: block;
      margin-bottom: 8px
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: var(--caribbean);
      margin: 0 0 5px 2px
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--cambridge);
      border-radius: 12px;
      font-size: 16px;
      background: #fffefa;
      color: var(--text)
    }

    input:focus {
      outline: none;
      border-color: var(--caribbean);
      box-shadow: 0 0 0 3px rgba(10, 103, 114, .12)
    }

    button,
    a.btn {
      display: inline-block;
      text-decoration: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 15px;
      font-weight: bold;
      cursor: pointer
    }

    .primary {
      background: var(--caribbean);
      color: #fff
    }

    .secondary {
      background: var(--cambridge);
      color: #163c3f
    }

    .accent {
      background: var(--sienna);
      color: white
    }

    .danger {
      background: var(--redwood);
      color: #fff
    }

    .ghost {
      background: transparent;
      color: white;
      border: 1px solid rgba(255, 255, 255, .3)
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
      justify-content: center;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: bold
    }

    .badge.running {
      background: #e8f3ef;
      color: var(--caribbean)
    }

    .badge.done {
      background: #f6ead0;
      color: #7a5a13
    }

    .match {
      background: #f3f8f6;
      border: 1px solid var(--cambridge);
      border-radius: 15px;
      padding: 12px;
      margin-bottom: 10px
    }

    .match-title {
      color: var(--caribbean);
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: uppercase
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr 52px 18px 52px 1fr;
      gap: 5px;
      align-items: center
    }

    .team {
      text-align: center;
      font-weight: bold;
      font-size: 14px
    }

    .score input {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 8px 3px;
      border-color: var(--ecru)
    }

    .dash {
      text-align: center;
      color: var(--sienna);
      font-weight: bold
    }

    .status {
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted)
    }

    .error {
      color: var(--redwood);
      font-weight: bold
    }

    .ok {
      color: var(--caribbean);
      font-weight: bold
    }

    .progress {
      height: 10px;
      background: #eadfbf;
      border-radius: 999px;
      overflow: hidden;
      margin: 10px 0
    }

    .progress span {
      display: block;
      height: 100%;
      background: var(--sienna)
    }

    .tablewrap {
      overflow: auto;
      border: 1px solid var(--cambridge);
      border-radius: 14px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px
    }

    th,
    td {
      padding: 10px 7px;
      border-bottom: 1px solid #dde7e2;
      text-align: center;
      font-size: 13px
    }

    th {
      background: var(--cambridge);
      color: #173c3f;
      font-size: 12px
    }

    th:first-child,
    td:first-child {
      text-align: left
    }

    tbody tr:nth-child(even) {
      background: #fbf8f1
    }

    .podium {
      display: grid;
      gap: 12px
    }

    .place {
      background: var(--card);
      border: 1px solid var(--cambridge);
      border-radius: 18px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(10, 103, 114, .07)
    }

    .place.first {
      padding: 24px;
      background: linear-gradient(180deg, #fff9e8, #fffdf9);
      border-color: var(--ecru)
    }

    .medal {
      font-size: 40px
    }

    .place strong {
      display: block;
      font-size: 20px;
      margin: 5px 0;
      color: var(--caribbean)
    }

    .history-item {
      border: 1px solid var(--cambridge);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      background: #fffefa
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start
    }

    .history-name {
      font-weight: bold;
      color: var(--caribbean);
      font-size: 17px
    }

    .home-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .home-action {
      text-align: center;
      padding: 18px
    }

    .home-action .emoji {
      font-size: 32px;
      display: block;
      margin-bottom: 8px
    }

    .note {
      background: #fff8e7;
      border-left: 4px solid var(--ecru);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      color: #6d5a2c
    }

    .pair-card {
      border: 1px solid var(--cambridge);
      border-radius: 14px;
      padding: 12px;
      background: #f9fcfa
    }

    .pair-card h3 {
      margin: 0 0 10px;
      font-size: 15px
    }

    .confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .confirm-box {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--card);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
    }

    .confirm-box h2 {
      margin-top: 0;
      text-align: center;
    }

    .confirm-data {
      margin-top: 16px;
      line-height: 1.6;
    }

    .confirm-list {
      margin: 10px 0 0;
      padding-left: 24px;
    }

    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    @media(max-width:600px) {

      .grid,
      .home-grid,
      .mode-grid {
        grid-template-columns: 1fr
      }

      .teams {
        grid-template-columns: 1fr 46px 14px 46px 1fr
      }

      .team {
        font-size: 12px
      }

      main {
        padding: 12px 12px 24px
      }
      .actions {
        flex-direction: column;
        align-items: center;
      }

      .actions .btn,
      .actions button {
        width: 100%;
        max-width: 280px;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="header-row">

        <div class="header-title">
          <span class="header-icon">🎾</span>

          <div class="header-text">
            <h1>Super 8 Padel</h1>
            <small id="subtitle">Nuevo torneo</small>
          </div>
        </div>

        <a class="btn ghost" href="inicio.html">🏠 Inicio</a>

      </div>
    </div>
  </header>
  <main>
    <div class="card">
      <h2>Datos del torneo</h2>
      <div class="grid">
        <div><label>Nombre del torneo</label><input id="tname" placeholder="Ej.: Super 8 del jueves"></div>
        <div><label>Fecha</label><input id="tdate" type="date"></div>
        <div><label>Puntos para ganar cada partido</label><input id="target" type="number" min="1" step="1" value="4">
        </div>
      </div>
      <div class="note" style="margin-top:12px">El resultado debe llegar exactamente al puntaje objetivo. Ej.: si se
        juega a 4, son válidos 4-0, 4-1, 4-2 o 4-3.</div>
    </div>
    <div class="card">
      <h2 id="entryTitle"></h2>
      <div id="entries"></div>
      <div class="actions"><button class="secondary" onclick="example()">Cargar ejemplo</button><button class="primary"
          onclick="createTournament()">Comenzar torneo</button></div>
    </div>
  </main>

  <div id="confirmOverlay" class="confirm-overlay">

    <div class="confirm-box">

      <h2>¿Confirmás los datos del torneo?</h2>

      <div id="confirmContent" class="confirm-data"></div>

      <div class="confirm-actions">

        <button class="secondary" onclick="closeConfirmation()">
          ← Volver a editar
        </button>

        <button class="primary" onclick="confirmTournament()">
          Comenzar torneo
        </button>

      </div>

    </div>

  </div>

  <footer>
    <div class="wrap">© 2026 Dana Grecco</div>
  </footer>


  <script>
    function getTournaments() { return JSON.parse(localStorage.getItem('super8_tournaments') || '[]'); }
    function setTournaments(list) { localStorage.setItem('super8_tournaments', JSON.stringify(list)); }
    function getCurrentId() { return localStorage.getItem('super8_current_id'); }
    function setCurrentId(id) { localStorage.setItem('super8_current_id', String(id)); }
    function getCurrentTournament() {
      const id = getCurrentId();
      if (!id) return null;
      return getTournaments().find(t => String(t.id) === String(id)) || null;
    }
    function saveTournamentObject(t) {
      const list = getTournaments();
      const idx = list.findIndex(x => String(x.id) === String(t.id));
      if (idx >= 0) list[idx] = t; else list.unshift(t);
      setTournaments(list);
    }
    function formatDate(v) {
      if (!v) return '';
      const p = v.split('-');
      return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : v;
    }

    const mode = localStorage.getItem('super8_new_mode') || 'individual';

    document.getElementById('tdate').value =
      new Date().toISOString().slice(0, 10);

    document.getElementById('subtitle').textContent =
      mode === 'pairs'
        ? 'Nuevo torneo · Por parejas'
        : 'Nuevo torneo · Individual';

    function renderEntries() {
      const box = document.getElementById('entries');
      if (mode === 'pairs') {
        document.getElementById('entryTitle').textContent = '8 parejas';
        let h = '<div class="grid">';
        for (let i = 1; i <= 8; i++)h += `<div class="pair-card"><h3>Pareja ${i}</h3><label>Integrante 1</label><input id="p${i}a" placeholder="Nombre"><div style="height:8px"></div><label>Integrante 2</label><input id="p${i}b" placeholder="Nombre"></div>`;
        h += '</div>'; box.innerHTML = h;
      } else {
        document.getElementById('entryTitle').textContent = '8 participantes';
        let h = '<div class="grid">';
        for (let i = 1; i <= 8; i++)h += `<div><label>Participante ${i}</label><input id="p${i}" placeholder="Nombre"></div>`;
        h += '</div>'; box.innerHTML = h;
      }
    }

    function example() {
      if (mode === 'pairs') {
        const a = ['Ana', 'Carla', 'Eva', 'Gabi', 'Iris', 'Lara', 'Marta', 'Nora'], b = ['Juan', 'Luis', 'Pablo', 'Tomi', 'Santi', 'Diego', 'Marco', 'Leo'];
        for (let i = 1; i <= 8; i++) { document.getElementById(`p${i}a`).value = a[i - 1]; document.getElementById(`p${i}b`).value = b[i - 1]; }
      } else {
        ['Ana', 'Bea', 'Carla', 'Dani', 'Eva', 'Flor', 'Gabi', 'Luz'].forEach((n, i) => document.getElementById('p' + (i + 1)).value = n);
      }
    }

    let pendingTournament = null;

    function createTournament() {

      const name =
        document.getElementById('tname').value.trim() || 'Super 8 Padel';

      const date =
        document.getElementById('tdate').value;

      const target =
        Number(document.getElementById('target').value);


      if (!Number.isInteger(target) || target <= 0) {

        alert('Ingresá una cantidad de puntos válida.');

        return;
      }


      let t = {
        id: Date.now(),
        name,
        date,
        target,
        mode,
        results: {},
        status: 'En curso',
        createdAt: new Date().toISOString()
      };


      if (mode === 'pairs') {

        const pairs = [];
        const names = [];

        for (let i = 1; i <= 8; i++) {

          const a =
            document.getElementById(`p${i}a`).value.trim();

          const b =
            document.getElementById(`p${i}b`).value.trim();


          if (!a || !b) {

            alert(
              `Completá los dos integrantes de la Pareja ${i}.`
            );

            return;
          }


          pairs.push({
            member1: a,
            member2: b
          });

          names.push(
            a.toLowerCase(),
            b.toLowerCase()
          );
        }


        if (new Set(names).size !== 16) {

          alert(
            'No puede haber nombres repetidos entre los integrantes de las parejas.'
          );

          return;
        }


        t.pairs = pairs;

      } else {

        const players = [];


        for (let i = 1; i <= 8; i++) {

          const v =
            document.getElementById('p' + i).value.trim();


          if (!v) {

            alert(
              `Falta completar el Participante ${i}.`
            );

            return;
          }


          players.push(v);
        }


        if (
          new Set(
            players.map(x => x.toLowerCase())
          ).size !== 8
        ) {

          alert(
            'No puede haber nombres repetidos.'
          );

          return;
        }


        t.players = players;
      }


      pendingTournament = t;

      showConfirmation();
    }

    function showConfirmation() {

      const t = pendingTournament;

      if (!t) return;


      let participantsHtml = '';


      if (t.mode === 'pairs') {

        participantsHtml = `
          <strong>Parejas:</strong>

          <ol class="confirm-list">

            ${t.pairs.map(p => `
              <li>${p.member1} / ${p.member2}</li>
            `).join('')}

          </ol>
        `;

      } else {

        participantsHtml = `
          <strong>Participantes:</strong>

          <ol class="confirm-list">

            ${t.players.map(name => `
              <li>${name}</li>
            `).join('')}

          </ol>
        `;
      }


      document.getElementById('confirmContent').innerHTML = `

        <strong>Torneo:</strong>
        ${t.name}

        <br>

        <strong>Fecha:</strong>
        ${formatDate(t.date)}

        <br>

        <strong>Modalidad:</strong>
        ${t.mode === 'pairs'
          ? 'Por parejas'
          : 'Individual'}

        <br>

        <strong>Puntos:</strong>
        ${t.target}

        <br><br>

        ${participantsHtml}
      `;


      document.getElementById('confirmOverlay')
        .style.display = 'flex';
    }

    function closeConfirmation() {

      document.getElementById('confirmOverlay')
        .style.display = 'none';

      pendingTournament = null;
    }

    function confirmTournament() {

      if (!pendingTournament) return;


      saveTournamentObject(
        pendingTournament
      );

      setCurrentId(
        pendingTournament.id
      );

      localStorage.setItem(
        'super8_round',
        '0'
      );


      location.href =
        'rondas.html';
    }



    renderEntries();
  </script>

    <script src="assets/js/lucide.min.js"></script>
      <script>
        lucide.createIcons();
      </script>

</body>

</html>
