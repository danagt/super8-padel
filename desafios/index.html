<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#cc5a30">

  <title>Desafíos x 3 - Nuevo desafío</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>

    <div class="wrap">
      <div class="header-row">
        <div class="header-title">
          <i data-lucide=""></i>
          <div class="header-text">
            <h1>
              Desafíos x 3
            </h1>
            <small>
              Nuevo desafío
            </small>
          </div>
        </div>

        <a class="btn ghost" href="../inicio.html">
          <i data-lucide="house"></i>
          Inicio
        </a>
      </div>
    </div>

  </header>

  <main>

    <!-- DATOS DEL DESAFÍO -->

    <section class="card">
      <h2>
        Datos del desafío
      </h2>
      <div class="grid">
        <div>
          <label for="name">
            Nombre
          </label>
          <input id="name" type="text" placeholder="Ej.: Miércoles de padel" enterkeyhint="next" autocomplete="off">
        </div>

        <div>
          <label for="date">
            Fecha
          </label>
          <input id="date" type="date">
        </div>

        <div>
          <label for="duration">
            Duración prevista
          </label>
          <select id="duration">
            <option value="60">
              1 hora
            </option>
            <option value="90">
              1 hora 30 min
            </option>
            <option value="120" selected>
              2 horas
            </option>
            <option value="150">
              2 horas 30 min
            </option>
            <option value="180">
              3 horas
            </option>
            <option value="custom">
              Personalizada
            </option>

          </select>
        </div>

        <div id="customDurationBox" style="display:none">
          <label for="customDuration">
            Minutos
          </label>
          <input id="customDuration" type="number" min="15" step="5" inputmode="numeric" placeholder="Ej.: 105">
        </div>
      </div>

      <div class="note" style="margin-top:12px">
        En cada partido solamente se registra qué pareja ganó.
        La clasificación se calcula por cantidad de partidos ganados.
      </div>

    </section>

    <!-- PAREJAS -->

    <section class="card">
      <h2>
        Las 3 parejas
      </h2>
      <div class="grid">

        <!-- PAREJA A -->
        <div class="pair-card">
          <h3>
            Pareja A
          </h3>
          <label for="p1a">
            Integrante 1
          </label>
          <input id="p1a" type="text" placeholder="Nombre" enterkeyhint="next" autocomplete="off">

          <div style="height:8px"></div>

          <label for="p1b">
            Integrante 2
          </label>

          <input id="p1b" type="text" placeholder="Nombre" enterkeyhint="next" autocomplete="off">

        </div>

        <!-- PAREJA B -->
        <div class="pair-card">
          <h3>
            Pareja B
          </h3>
          <label for="p2a">
            Integrante 1
          </label>
          <input id="p2a" type="text" placeholder="Nombre" enterkeyhint="next" autocomplete="off">

          <div style="height:8px"></div>

          <label for="p2b">
            Integrante 2
          </label>

          <input id="p2b" type="text" placeholder="Nombre" enterkeyhint="next" autocomplete="off">

        </div>

        <!-- PAREJA C -->
        <div class="pair-card">
          <h3>
            Pareja C
          </h3>
          <label for="p3a">
            Integrante 1
          </label>

          <input id="p3a" type="text" placeholder="Nombre" enterkeyhint="next" autocomplete="off">

          <div style="height:8px"></div>

          <label for="p3b">
            Integrante 2
          </label>

          <input id="p3b" type="text" placeholder="Nombre" enterkeyhint="done" autocomplete="off">

        </div>

      </div>

      <div class="actions">
        <button class="secondary" type="button" onclick="loadExample()">
          <i data-lucide=""></i>
          Cargar ejemplo
        </button>
        <button id="createButton" class="primary" type="button" onclick="createChallenge()">
          <i data-lucide=""></i>
          Comenzar desafío
        </button>
      </div>

    </section>

  </main>

  <footer>
    <div class="wrap">
      © 2026 Dana Grecco
    </div>

  </footer>

  <script src="../assets/js/lucide.min.js"></script>

  <script>

    /* =========================
       LOCAL STORAGE
       ========================= */

    function safeReadList(key) {
      try {
        const raw =
          localStorage.getItem(key);
        if (!raw) {
          return [];
        }
        const parsed =
          JSON.parse(raw);
        return Array.isArray(parsed)
          ? parsed
          : [];
      } catch (error) {
        console.error(
          `No se pudo leer ${key}:`,
          error
        );
        return [];
      }
    }

    function safeWriteList(
      key,
      value
    ) {
      try {
        localStorage.setItem(
          key,
          JSON.stringify(value)
        );
        return true;
      } catch (error) {
        console.error(
          `No se pudo guardar ${key}:`,
          error
        );
        alert(
          'No se pudo guardar la información en este dispositivo.'
        );
        return false;
      }
    }

    /* =========================
       FECHA ACTUAL
       ========================= */

    function getTodayLocal() {
      const now =
        new Date();
      const year =
        now.getFullYear();
      const month =
        String(
          now.getMonth() + 1
        ).padStart(
          2,
          '0'
        );
      const day =
        String(
          now.getDate()
        ).padStart(
          2,
          '0'
        );
      return `${year}-${month}-${day}`;
    }

    document.getElementById(
      'date'
    ).value =
      getTodayLocal();

    /* =========================
       DURACIÓN
       ========================= */

    const duration =
      document.getElementById(
        'duration'
      );
    duration.addEventListener(
      'change',
      () => {
        const customBox =
          document.getElementById(
            'customDurationBox'
          );
        customBox.style.display =
          duration.value === 'custom'
            ? 'block'
            : 'none';
        if (
          duration.value ===
          'custom'
        ) {
          setTimeout(
            () => {
              document.getElementById(
                'customDuration'
              ).focus();
            },
            50
          );
        }
      }
    );

    /* =========================
       EJEMPLO
       ========================= */

    function loadExample() {
      const values = {
        p1a:
          'Ana',
        p1b:
          'Juan',
        p2a:
          'Carla',
        p2b:
          'Luis',
        p3a:
          'Eva',
        p3b:
          'Pablo'
      };

      Object.entries(
        values
      ).forEach(
        ([id, value]) => {
          document.getElementById(
            id
          ).value =
            value;
        }
      );
    }

    /* =========================
       AVANCE ENTRE CAMPOS
       CELULAR / TECLADO
       ========================= */

    const formFields = [
      document.getElementById('name'),
      document.getElementById('date'),
      document.getElementById('duration'),
      document.getElementById(
        'p1a'
      ),
      document.getElementById(
        'p1b'
      ),
      document.getElementById(
        'p2a'
      ),
      document.getElementById(
        'p2b'
      ),
      document.getElementById(
        'p3a'
      ),
      document.getElementById(
        'p3b'
      )
    ];

    formFields.forEach(
      (input, index) => {
        input.addEventListener(
          'keydown',
          event => {
            if (
              event.key !==
              'Enter'
            ) {
              return;
            }
            event.preventDefault();
            if (
              index <
              formFields.length - 1
            ) {
              formFields[
                index + 1
              ].focus();
            } else {
              document.getElementById(
                'createButton'
              ).focus();
            }
          }
        );
      }
    );

    /* =========================
       CREAR DESAFÍO
       ========================= */

    function createChallenge() {
      let durationMinutes;

      if (
        duration.value ===
        'custom'
      ) {
        durationMinutes =
          Number(
            document.getElementById(
              'customDuration'
            ).value
          );
        if (
          !Number.isInteger(
            durationMinutes
          ) ||
          durationMinutes < 15
        ) {
          alert(
            'Ingresá una duración válida de al menos 15 minutos.'
          );
          document.getElementById(
            'customDuration'
          ).focus();
          return;
        }
      } else {
        durationMinutes =
          Number(
            duration.value
          );
      }

      const pairs =
        [];
      const allNames =
        [];

      for (
        let i = 1;
        i <= 3;
        i++
      ) {

        const inputA =
          document.getElementById(
            `p${i}a`
          );

        const inputB =
          document.getElementById(
            `p${i}b`
          );

        const member1 =
          inputA.value.trim();

        const member2 =
          inputB.value.trim();

        if (
          !member1 ||
          !member2
        ) {
          alert(
            `Completá los dos integrantes de la Pareja ${String.fromCharCode(64 + i)}.`
          );
          if (!member1) {
            inputA.focus();
          } else {
            inputB.focus();
          }
          return;
        }

        pairs.push({
          id:
            i,
          label:
            String.fromCharCode(
              64 + i
            ),
          member1:
            member1,
          member2:
            member2,
          name:
            `${member1} / ${member2}`,
          played:
            0,
          won:
            0,
          lost:
            0
        });

        allNames.push(
          member1.toLowerCase(),
          member2.toLowerCase()
        );
      }

      /* NO PERMITIR NOMBRES REPETIDOS */

      if (
        new Set(
          allNames
        ).size !== 6
      ) {
        alert(
          'No puede haber nombres repetidos entre los integrantes.'
        );
        return;
      }

      /* CREAR DESAFÍO */

      const challenge = {
        id:
          Date.now(),
        gameType:
          'desafiosx3',
        name:
          document.getElementById(
            'name'
          ).value.trim() ||
          'Desafíos x 3',
        date:
          document.getElementById(
            'date'
          ).value,
        durationMinutes:
          durationMinutes,
        status:
          'En curso',
        pairs:
          pairs,
        matches:
          [],
        tieBreakMatches:
          [],
        phase:
          'normal',
        currentMatch: {
          number:
            1,
          pairA:
            1,
          pairB:
            2,
          waiting:
            3
        },
        streaks: {
          1:
            1,
          2:
            1,
          3:
            0
        },
        createdAt:
          new Date().toISOString()
      };

      const active =
        safeReadList(
          'desafiosx3_active'
        );
      active.unshift(
        challenge
      );
      if (
        !safeWriteList(
          'desafiosx3_active',
          active
        )
      ) {
        return;
      }

      localStorage.setItem(
        'desafiosx3_selected_id',
        String(
          challenge.id
        )
      );
      location.href =
        'partido.html';
    }

    if (window.matchMedia('(max-width: 600px)').matches) {
      setTimeout(() => {
        document.getElementById('name').focus();
      }, 300);
    }
    lucide.createIcons();

  </script>

</body>

</html>
