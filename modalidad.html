<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Super 8 - Modalidad</title>
  <style>
    :root {
      --caribbean: #0a6772;
      --cambridge: #99bdb0;
      --ecru: #dcc27f;
      --sienna: #df8869;
      --redwood: #a44a47;
      --bg: #f7f4ee;
      --card: #fffdf9;
      --text: #2f3a3c;
      --muted: #6f7d7b;
      --border: #d7ddd8;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text)
    }

    header {
      background: linear-gradient(135deg, var(--caribbean), #0d7a83);
      color: #fff;
      padding: 18px 20px;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 6px 18px rgba(10, 103, 114, .18);
    }

    header .wrap,
    main,
    footer .wrap {
      max-width: 820px;
      margin: auto
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    header small {
      color: #e7f1ee
    }

    .header-title h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .header-title small {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      color: #e7f1ee;
    }

    .home-button {
      display: flex;
      align-items: center;
      gap: 6px;

      text-decoration: none;

      background: rgba(255, 255, 255, .16);
      color: white;

      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 12px;

      padding: 10px 14px;

      font-size: 14px;
      font-weight: bold;

      transition: .2s;
    }

    .home-button:hover {
      background: rgba(255, 255, 255, .25);
      transform: translateY(-1px);
    }

    main {
      padding: 16px 16px 30px
    }

    footer {
      padding: 8px 16px 28px;
      text-align: center;
      font-size: 12px;
      color: var(--redwood)
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(153, 189, 176, .4);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 5px 20px rgba(10, 103, 114, .08)
    }
    .card h2 {
      font-size: 20px;
      text-align: center;
    }

    .hero {
      background: linear-gradient(135deg, var(--caribbean), #0d7a83);
      color: white;
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(10, 103, 114, .18)
    }

    .hero h2 {
      margin: 0 0 8px;
      font-size: 28px;
      color: white
    }

    .hero p {
      margin: 0;
      color: #e7f1ee;
      line-height: 1.5
    }

    h2,
    h3 {
      color: var(--caribbean)
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .mode-card {
      border: 2px solid var(--cambridge);
      background: #fffefa;
      border-radius: 18px;
      padding: 18px;
      cursor: pointer;
      text-align: center;
      transition: .2s
    }

    .mode-card:hover,
    .mode-card.selected {
      border-color: var(--caribbean);
      box-shadow: 0 0 0 3px rgba(10, 103, 114, .10)
    }

    .mode-card .emoji {
      font-size: 36px;
      display: block;
      margin-bottom: 8px
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: var(--caribbean);
      margin: 0 0 5px 2px
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--cambridge);
      border-radius: 12px;
      font-size: 16px;
      background: #fffefa;
      color: var(--text)
    }

    input:focus {
      outline: none;
      border-color: var(--caribbean);
      box-shadow: 0 0 0 3px rgba(10, 103, 114, .12)
    }

    button,
    a.btn {
      display: inline-block;
      text-decoration: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 15px;
      font-weight: bold;
      cursor: pointer
    }

    .primary {
      background: var(--caribbean);
      color: #fff
    }

    .secondary {
      background: var(--cambridge);
      color: #163c3f
    }

    .accent {
      background: var(--sienna);
      color: white
    }

    .danger {
      background: var(--redwood);
      color: #fff
    }

    .ghost {
      background: transparent;
      color: white;
      border: 1px solid rgba(255, 255, 255, .3)
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: bold
    }

    .badge.running {
      background: #e8f3ef;
      color: var(--caribbean)
    }

    .badge.done {
      background: #f6ead0;
      color: #7a5a13
    }

    .match {
      background: #f3f8f6;
      border: 1px solid var(--cambridge);
      border-radius: 15px;
      padding: 12px;
      margin-bottom: 10px
    }

    .match-title {
      color: var(--caribbean);
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: uppercase
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr 52px 18px 52px 1fr;
      gap: 5px;
      align-items: center
    }

    .team {
      text-align: center;
      font-weight: bold;
      font-size: 14px
    }

    .score input {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 8px 3px;
      border-color: var(--ecru)
    }

    .dash {
      text-align: center;
      color: var(--sienna);
      font-weight: bold
    }

    .status {
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted)
    }

    .error {
      color: var(--redwood);
      font-weight: bold
    }

    .ok {
      color: var(--caribbean);
      font-weight: bold
    }

    .progress {
      height: 10px;
      background: #eadfbf;
      border-radius: 999px;
      overflow: hidden;
      margin: 10px 0
    }

    .progress span {
      display: block;
      height: 100%;
      background: var(--sienna)
    }

    .tablewrap {
      overflow: auto;
      border: 1px solid var(--cambridge);
      border-radius: 14px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px
    }

    th,
    td {
      padding: 10px 7px;
      border-bottom: 1px solid #dde7e2;
      text-align: center;
      font-size: 13px
    }

    th {
      background: var(--cambridge);
      color: #173c3f;
      font-size: 12px
    }

    th:first-child,
    td:first-child {
      text-align: left
    }

    tbody tr:nth-child(even) {
      background: #fbf8f1
    }

    .podium {
      display: grid;
      gap: 12px
    }

    .place {
      background: var(--card);
      border: 1px solid var(--cambridge);
      border-radius: 18px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(10, 103, 114, .07)
    }

    .place.first {
      padding: 24px;
      background: linear-gradient(180deg, #fff9e8, #fffdf9);
      border-color: var(--ecru)
    }

    .medal {
      font-size: 40px
    }

    .place strong {
      display: block;
      font-size: 20px;
      margin: 5px 0;
      color: var(--caribbean)
    }

    .history-item {
      border: 1px solid var(--cambridge);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      background: #fffefa
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start
    }

    .history-name {
      font-weight: bold;
      color: var(--caribbean);
      font-size: 17px
    }

    .home-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .home-action {
      text-align: center;
      padding: 18px
    }

    .home-action .emoji {
      font-size: 32px;
      display: block;
      margin-bottom: 8px
    }

    .note {
      background: #fff8e7;
      border-left: 4px solid var(--ecru);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      color: #6d5a2c
    }

    .pair-card {
      border: 1px solid var(--cambridge);
      border-radius: 14px;
      padding: 12px;
      background: #f9fcfa
    }

    .pair-card h3 {
      margin: 0 0 10px;
      font-size: 15px
    }

    @media(max-width:600px) {

      .grid,
      .home-grid,
      .mode-grid {
        grid-template-columns: 1fr
      }

      .teams {
        grid-template-columns: 1fr 46px 14px 46px 1fr
      }

      .team {
        font-size: 12px
      }

      .header-title h1 {
        font-size: 19px;
      }

      .home-button span {
        display: none;
      }

      .home-button {
        padding: 9px 11px;
        font-size: 18px;
      }

      main {
        padding: 12px 12px 24px
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="header-row">

        <div class="header-title">
          <h1>🎾 Super 8 Padel</h1>
          <small>Elegir modalidad</small>
        </div>

        <a class="home-button" href="inicio.html">
          🏠 <span>Inicio</span>
        </a>

      </div>
    </div>
  </header>
  <main>
    <div class="card">
      <h2>¿Cómo se juega este Super 8?</h2>
      <div class="mode-grid">
        <div class="mode-card" onclick="choose('individual')"><span class="emoji">👤</span>
          <h3>Individual</h3>
          <p class="muted">8 participantes · 7 rondas · 14 partidos</p>
        </div>
        <div class="mode-card" onclick="choose('pairs')"><span class="emoji">👥</span>
          <h3>Por parejas</h3>
          <p class="muted">8 parejas · 7 rondas · 28 partidos</p>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <div class="wrap">© Dana Grecco</div>
  </footer>
  <script>
    function choose(mode) { localStorage.setItem('super8_new_mode', mode); location.href = 'jugadoras.html'; }
  </script>
</body>

</html>
