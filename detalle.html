<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Super 8 Padel - Detalle del torneo</title>

  <style>
    :root {
      --caribbean: #0a6772;
      --cambridge: #99bdb0;
      --ecru: #dcc27f;
      --sienna: #df8869;
      --redwood: #a44a47;
      --bg: #f7f4ee;
      --card: #fffdf9;
      --text: #2f3a3c;
      --muted: #6f7d7b;
      --border: #d7ddd8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: var(--caribbean);
      color: #fff;
      padding: 16px;
    }

    header .wrap,
    main,
    footer .wrap {
      max-width: 820px;
      margin: auto;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-title {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .header-icon {
      font-size: 20px;
      line-height: 1.2;
    }

    .header-text {
      display: flex;
      flex-direction: column;
    }

    .header-text h1 {
      margin: 0;
      font-size: 20px;
    }

    .header-text small {
      margin-top: 2px;
      font-size: 13px;
      color: #e7f1ee;
    }

    main {
      padding: 16px 16px 30px;
    }

    footer {
      padding: 8px 16px 28px;
      text-align: center;
      font-size: 12px;
      color: var(--redwood);
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(153, 189, 176, .4);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 5px 20px rgba(10, 103, 114, .08);
    }

    h2,
    h3 {
      color: var(--caribbean);
    }

    h2 {
      margin-top: 0;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .info-box {
      background: #f3f8f6;
      border: 1px solid var(--cambridge);
      border-radius: 14px;
      padding: 12px;
    }

    .info-label {
      font-size: 12px;
      font-weight: bold;
      color: var(--caribbean);
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 15px;
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: bold;
    }

    .badge.done {
      background: #f5e2e1;
      color: var(--redwood);
      border: 1px solid rgba(164, 74, 71, .18);
    }

    .participants {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .participant {
      background: #f9fcfa;
      border: 1px solid var(--cambridge);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .participant-number {
      color: var(--redwood);
      font-weight: bold;
      margin-right: 5px;
    }

    .tablewrap {
      overflow-x: auto;
      border: 1px solid var(--cambridge);
      border-radius: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }

    th,
    td {
      padding: 10px 7px;
      border-bottom: 1px solid #dde7e2;
      text-align: center;
      font-size: 13px;
    }

    th {
      background: var(--cambridge);
      color: #173c3f;
      font-size: 12px;
    }

    th:nth-child(2),
    td:nth-child(2) {
      text-align: left;
    }

    tbody tr:nth-child(even) {
      background: #fbf8f1;
    }

    .position {
      font-weight: bold;
      color: var(--caribbean);
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
      justify-content: center;
    }

    button,
    a.btn {
      display: inline-block;
      text-decoration: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: var(--caribbean);
      color: #fff;
    }

    .secondary {
      background: var(--cambridge);
      color: #163c3f;
    }

    .accent {
      background: var(--sienna);
      color: white;
    }

    .ghost {
      background: transparent;
      color: white;
      border: 1px solid rgba(255, 255, 255, .3);
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .error {
      color: var(--redwood);
      font-weight: bold;
      text-align: center;
    }

    svg.lucide {
      width: 18px;
      height: 18px;
      stroke-width: 2;
      vertical-align: middle;
    }

    button svg.lucide,
    a.btn svg.lucide {
      margin-right: 5px;
    }

    .header-icon svg {
      width: 21px;
      height: 21px;
    }

    @media(max-width:600px) {

      .info-grid,
      .participants {
        grid-template-columns: 1fr;
      }

      main {
        padding: 12px 12px 24px;
      }

      .header-text h1 {
        font-size: 18px;
      }

      .header-text small {
        font-size: 12px;
      }

      .actions {
        flex-direction: column;
        align-items: center;
      }

      .actions .btn,
      .actions button {
        width: 100%;
        max-width: 280px;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="wrap">
      <div class="header-row">

        <div class="header-title">
          <span class="header-icon">
            <i data-lucide="file-text"></i>
          </span>

          <div class="header-text">
            <h1>Super 8 Padel</h1>
            <small>Detalle del torneo</small>
          </div>
        </div>

        <a class="btn ghost" href="historial.html">
          <i data-lucide="arrow-left"></i>
          Historial
        </a>

      </div>
    </div>
  </header>

  <main>

    <!-- DATOS DEL TORNEO -->

    <div class="card">

      <h2 id="tournamentName"></h2>

      <div class="info-grid" style="margin-top:16px;">

        <div class="info-box">
          <div class="info-label">Fecha</div>
          <div id="tournamentDate" class="info-value"></div>
        </div>

        <div class="info-box">
          <div class="info-label">Modalidad</div>
          <div id="tournamentMode" class="info-value"></div>
        </div>

        <div class="info-box">
          <div class="info-label">Puntos por partido</div>
          <div id="tournamentTarget" class="info-value"></div>
        </div>

        <div class="info-box">
          <div class="info-label">Estado</div>
          <div class="info-value">
            <span class="badge done">Finalizado</span>
          </div>
        </div>

      </div>

    </div>


    <!-- PARTICIPANTES -->

    <div class="card">

      <h2 id="participantsTitle">Participantes</h2>

      <div id="participants" class="participants"></div>

    </div>


    <!-- CLASIFICACIÓN -->

    <div class="card">

      <h2>Clasificación final</h2>

      <div class="tablewrap">

        <table>

          <thead>
            <tr>
              <th>Pos.</th>
              <th id="entityTitle">Participante</th>
              <th>PJ</th>
              <th>PG</th>
              <th>GF</th>
              <th>GC</th>
              <th>Dif.</th>
            </tr>
          </thead>

          <tbody id="classification"></tbody>

        </table>

      </div>

      <div class="actions">

        <a class="btn secondary" href="resultados.html">
          <i data-lucide="chart-no-axes-column"></i>
          Ver clasificación
        </a>

        <a class="btn accent" href="podio.html">
          <i data-lucide="trophy"></i>
          Ver podio
        </a>

      </div>

    </div>

  </main>


  <footer>
    <div class="wrap">© 2026 Dana Grecco</div>
  </footer>


  <script>

    /* =============================
       LOCAL STORAGE
       ============================= */

    function getTournaments() {
      return JSON.parse(
        localStorage.getItem('super8_tournaments') || '[]'
      );
    }

    function getCurrentId() {
      return localStorage.getItem('super8_current_id');
    }

    function getCurrentTournament() {

      const id = getCurrentId();

      if (!id) return null;

      return getTournaments().find(
        t => String(t.id) === String(id)
      ) || null;
    }


    function formatDate(v) {

      if (!v) return '';

      const p = v.split('-');

      return p.length === 3
        ? `${p[2]}/${p[1]}/${p[0]}`
        : v;
    }


    /* =============================
       FIXTURES
       ============================= */

    const individualFixture = [

      [[1, 2, 3, 4], [5, 6, 7, 8]],

      [[1, 3, 5, 7], [2, 4, 6, 8]],

      [[2, 3, 6, 7], [1, 4, 5, 8]],

      [[1, 5, 2, 6], [3, 7, 4, 8]],

      [[2, 5, 4, 7], [1, 6, 3, 8]],

      [[2, 8, 3, 5], [1, 7, 4, 6]],

      [[3, 6, 4, 5], [1, 8, 2, 7]]

    ];


    const pairsFixture = [

      [[1, 8], [2, 7], [3, 6], [4, 5]],

      [[1, 7], [8, 6], [2, 5], [3, 4]],

      [[1, 6], [7, 5], [8, 4], [2, 3]],

      [[1, 5], [6, 4], [7, 3], [8, 2]],

      [[1, 4], [5, 3], [6, 2], [7, 8]],

      [[1, 3], [4, 2], [5, 8], [6, 7]],

      [[1, 2], [3, 8], [4, 7], [5, 6]]

    ];


    /* =============================
       DATOS DEL TORNEO
       ============================= */

    const data = getCurrentTournament();

    if (!data) {
      location.href = 'historial.html';
    }


    function displayEntity(id) {

      if (data.mode === 'pairs') {

        const p = data.pairs[id - 1];

        return `${p.member1} / ${p.member2}`;
      }

      return data.players[id - 1];
    }


    /* =============================
       MOSTRAR DATOS
       ============================= */

    function renderTournamentInfo() {

      document.getElementById('tournamentName').textContent =
        data.name;

      document.getElementById('tournamentDate').textContent =
        formatDate(data.date);

      document.getElementById('tournamentMode').textContent =
        data.mode === 'pairs'
          ? 'Por parejas'
          : 'Individual';

      document.getElementById('tournamentTarget').textContent =
        `${data.target} puntos`;

    }


    /* =============================
       PARTICIPANTES
       ============================= */

    function renderParticipants() {

      const box =
        document.getElementById('participants');

      let html = '';

      if (data.mode === 'pairs') {

        document.getElementById('participantsTitle')
          .textContent = 'Parejas';

        document.getElementById('entityTitle')
          .textContent = 'Pareja';

        data.pairs.forEach((p, i) => {

          html += `
            <div class="participant">
              <span class="participant-number">
                ${i + 1}.
              </span>
              ${p.member1} / ${p.member2}
            </div>
          `;

        });

      } else {

        document.getElementById('participantsTitle')
          .textContent = 'Participantes';

        document.getElementById('entityTitle')
          .textContent = 'Participante';

        data.players.forEach((name, i) => {

          html += `
            <div class="participant">
              <span class="participant-number">
                ${i + 1}.
              </span>
              ${name}
            </div>
          `;

        });

      }

      box.innerHTML = html;

    }


    /* =============================
       ESTADÍSTICAS
       ============================= */

    function calculateStats() {

      const stats = [];

      for (let i = 1; i <= 8; i++) {

        stats.push({
          id: i,
          name: displayEntity(i),
          pj: 0,
          pg: 0,
          gf: 0,
          gc: 0,
          diff: 0
        });

      }


      if (data.mode === 'pairs') {

        pairsFixture.forEach((round, ri) => {

          round.forEach((match, mi) => {

            const result =
              data.results[
              `r${ri + 1}m${mi + 1}`
              ];

            if (!result || !result.valid)
              return;

            const left = stats[match[0] - 1];
            const right = stats[match[1] - 1];

            left.pj++;
            right.pj++;

            left.gf += result.a;
            left.gc += result.b;

            right.gf += result.b;
            right.gc += result.a;

            if (result.a > result.b) {
              left.pg++;
            } else {
              right.pg++;
            }

          });

        });

      } else {

        individualFixture.forEach((round, ri) => {

          round.forEach((match, mi) => {

            const result =
              data.results[
              `r${ri + 1}m${mi + 1}`
              ];

            if (!result || !result.valid)
              return;

            const teamA = [
              stats[match[0] - 1],
              stats[match[1] - 1]
            ];

            const teamB = [
              stats[match[2] - 1],
              stats[match[3] - 1]
            ];

            teamA.forEach(p => {

              p.pj++;
              p.gf += result.a;
              p.gc += result.b;

              if (result.a > result.b)
                p.pg++;

            });

            teamB.forEach(p => {

              p.pj++;
              p.gf += result.b;
              p.gc += result.a;

              if (result.b > result.a)
                p.pg++;

            });

          });

        });

      }

      stats.forEach(s => {
        s.diff = s.gf - s.gc;
      });

      return stats;

    }


    /* =============================
       ENFRENTAMIENTO DIRECTO
       ============================= */

    function directWinner(id1, id2) {

      const fixture =
        data.mode === 'pairs'
          ? pairsFixture
          : individualFixture;


      for (let ri = 0; ri < fixture.length; ri++) {

        for (
          let mi = 0;
          mi < fixture[ri].length;
          mi++
        ) {

          const match = fixture[ri][mi];

          const result =
            data.results[
            `r${ri + 1}m${mi + 1}`
            ];

          if (!result || !result.valid)
            continue;


          if (data.mode === 'pairs') {

            if (
              match[0] === id1 &&
              match[1] === id2
            ) {

              return result.a > result.b
                ? id1
                : id2;

            }


            if (
              match[0] === id2 &&
              match[1] === id1
            ) {

              return result.a > result.b
                ? id2
                : id1;

            }

          } else {

            const teamA = [
              match[0],
              match[1]
            ];

            const teamB = [
              match[2],
              match[3]
            ];


            if (
              teamA.includes(id1) &&
              teamB.includes(id2)
            ) {

              return result.a > result.b
                ? id1
                : id2;

            }


            if (
              teamA.includes(id2) &&
              teamB.includes(id1)
            ) {

              return result.a > result.b
                ? id2
                : id1;

            }

          }

        }

      }

      return null;

    }


    /* =============================
       ORDENAR CLASIFICACIÓN
       ============================= */

    function calculateRanking() {

      let stats = calculateStats();

      stats.sort((a, b) => {

        if (b.pg !== a.pg)
          return b.pg - a.pg;

        if (b.diff !== a.diff)
          return b.diff - a.diff;

        return 0;

      });


      let start = 0;

      while (start < stats.length) {

        let end = start + 1;

        while (
          end < stats.length &&
          stats[end].pg === stats[start].pg &&
          stats[end].diff === stats[start].diff
        ) {
          end++;
        }


        const group =
          stats.slice(start, end);


        if (group.length === 2) {

          const winner =
            directWinner(
              group[0].id,
              group[1].id
            );

          if (
            winner &&
            group[1].id === winner
          ) {

            stats[start] = group[1];
            stats[start + 1] = group[0];

          }

        } else if (group.length > 1) {

          group.sort((a, b) => {

            if (b.gf !== a.gf)
              return b.gf - a.gf;

            return a.gc - b.gc;

          });

          group.forEach((player, index) => {
            stats[start + index] = player;
          });

        }

        start = end;

      }


      return stats;

    }


    /* =============================
       MOSTRAR CLASIFICACIÓN
       ============================= */

    function renderClassification() {

      const ranking =
        calculateRanking();

      const tbody =
        document.getElementById('classification');

      tbody.innerHTML =
        ranking.map((p, i) => {

          return `
            <tr>

              <td class="position">
                ${i + 1}°
              </td>

              <td>
                ${p.name}
              </td>

              <td>${p.pj}</td>

              <td>${p.pg}</td>

              <td>${p.gf}</td>

              <td>${p.gc}</td>

              <td>
                ${p.diff > 0 ? '+' : ''}
                ${p.diff}
              </td>

            </tr>
          `;

        }).join('');

    }


    /* =============================
       INICIAR
       ============================= */

    renderTournamentInfo();

    renderParticipants();

    renderClassification();

  </script>

  <script src="assets/js/lucide.min.js"></script>
    <script>
      lucide.createIcons();
    </script>

</body>

</html>
