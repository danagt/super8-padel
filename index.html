<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super 8 Padel</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f7f4ee;
      color: #2f3a3c;
      padding: 20px;
    }

    .notice {
      max-width: 520px;
      width: 100%;
      background: #fffdf9;
      border: 1px solid #d7ddd8;
      border-radius: 18px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(10, 103, 114, .10);
    }

    h1 {
      color: #0a6772;
      margin-top: 0;
    }

    p {
      line-height: 1.5;
    }

    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      border-radius: 12px;
      background: #0a6772;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="notice">
    <h1>Super 8 Padel cambió de ubicación</h1>

    <p>
      Esta versión ya no se encuentra disponible en GitHub Pages.
    </p>

    <p>
      Para continuar utilizando Super 8 Padel, ingresá a la nueva versión
      publicada en Firebase.
    </p>

    <a href="https://super-8-padel.web.app/">
      Ir a Super 8 Padel
    </a>
  </div>

</body>
</html>
